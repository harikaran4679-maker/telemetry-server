<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Team Renew Telemetry</title>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {

            background: #111;

            color: white;

            padding: 30px;

            min-height: 100vh;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        h1 {

            color: #00ff88;

            font-size: 40px;

            margin-bottom: 35px;
        }


        /* =====================================================
           MAIN DASHBOARD
        ===================================================== */

        .dashboard {

            position: relative;

            width: 100%;

            min-height: 620px;
        }


        /* =====================================================
           COMMON CARD
        ===================================================== */

        .card {

            background: #1f1f1f;

            border-radius: 12px;

            box-shadow:
                0 0 12px rgba(0,255,136,0.15);

            border: 1px solid rgba(0,255,136,0.08);
        }


        /* =====================================================
           SPEED CARD
        ===================================================== */

        .speed-card {

            position: absolute;

            left: 27%;

            top: 0;

            width: 225px;

            height: 150px;

            text-align: center;

            padding: 20px;
        }


        .speed-card h2 {

            color: #00ff88;

            font-size: 18px;

            margin-bottom: 15px;
        }


        .speed-value {

            font-size: 34px;

            font-weight: bold;

            color: white;
        }


        .speed-unit {

            color: #aaa;

            margin-top: 5px;

            font-size: 14px;
        }


        /* =====================================================
           DYNAMICS ROW
        ===================================================== */

        .dynamics-row {

            position: absolute;

            left: 5%;

            top: 155px;

            width: 55%;

            display: flex;

            gap: 15px;
        }


        .small-card {

            flex: 1;

            min-width: 0;

            height: 115px;

            text-align: center;

            padding: 18px 10px;
        }


        .small-card h2 {

            color: #00ff88;

            font-size: 15px;

            margin-bottom: 12px;
        }


        .small-value {

            font-size: 27px;

            font-weight: bold;

            color: white;
        }


        .small-unit {

            color: #aaa;

            font-size: 13px;

            margin-top: 5px;
        }


        /* =====================================================
           MOTOR TEMPERATURE
        ===================================================== */

        .temperature-card {

            position: absolute;

            left: 38%;

            top: 285px;

            width: 215px;

            height: 125px;

            text-align: center;

            padding: 18px;
        }


        .temperature-card h2 {

            color: #00ff88;

            font-size: 16px;

            margin-bottom: 12px;
        }


        .temperature-value {

            font-size: 30px;

            font-weight: bold;

            color: white;
        }


        .temperature-unit {

            color: #aaa;

            font-size: 13px;

            margin-top: 4px;
        }


        /* =====================================================
           LIVE MAP CARD
        ===================================================== */

        .map-card {

            position: absolute;

            right: 2%;

            top: 0;

            width: 400px;

            height: 560px;

            padding: 18px;
        }


        .map-card h2 {

            color: #00ff88;

            font-size: 20px;

            margin-bottom: 15px;

            padding-bottom: 10px;

            border-bottom: 1px solid #333;
        }


        /* =====================================================
           MAP
        ===================================================== */

        #map {

            width: 100%;

            height: 400px;

            border-radius: 10px;

            overflow: hidden;
        }


        /* =====================================================
           MAP INFORMATION
        ===================================================== */

        .map-info {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            margin-top: 10px;

            background: #151515;

            border-radius: 8px;

            overflow: hidden;
        }


        .map-info-item {

            text-align: center;

            padding: 10px 5px;

            border-right:
                1px solid #333;
        }


        .map-info-item:last-child {

            border-right: none;
        }


        .map-info-label {

            color: #aaa;

            font-size: 12px;

            margin-bottom: 6px;
        }


        .map-info-value {

            color: white;

            font-size: 14px;

            font-weight: bold;

            white-space: nowrap;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1000px) {

            .dashboard {

                position: static;

                display: flex;

                flex-wrap: wrap;

                gap: 20px;
            }


            .speed-card,
            .dynamics-row,
            .temperature-card,
            .map-card {

                position: static;

                width: 100%;

                height: auto;
            }


            .dynamics-row {

                display: flex;
            }


            .map-card {

                max-width: 600px;
            }


            #map {

                height: 400px;
            }
        }


        @media (max-width: 600px) {

            body {

                padding: 15px;
            }


            h1 {

                font-size: 28px;
            }


            .dynamics-row {

                flex-direction: column;
            }


            .map-info {

                grid-template-columns:
                    repeat(2, 1fr);
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <h1>TEAM RENEW TELEMETRY</h1>


    <div class="dashboard">


        <!-- =================================================
             SPEED
        ================================================== -->

        <div class="card speed-card">

            <h2>SPEED</h2>

            <div class="speed-value"
                 id="speed">

                --

            </div>

            <div class="speed-unit">

                km/h

            </div>

        </div>


        <!-- =================================================
             ACCELERATION / SLOPE / DECELERATION
        ================================================== -->

        <div class="dynamics-row">


            <!-- ACCELERATION -->

            <div class="card small-card">

                <h2>ACCELERATION</h2>

                <div class="small-value"
                     id="acceleration">

                    --

                </div>

                <div class="small-unit">

                    m/s²

                </div>

            </div>


            <!-- SLOPE -->

            <div class="card small-card">

                <h2>SLOPE</h2>

                <div class="small-value"
                     id="slope">

                    --

                </div>

                <div class="small-unit">

                    degrees

                </div>

            </div>


            <!-- DECELERATION -->

            <div class="card small-card">

                <h2>DECELERATION</h2>

                <div class="small-value"
                     id="deceleration">

                    --

                </div>

                <div class="small-unit">

                    m/s²

                </div>

            </div>


        </div>


        <!-- =================================================
             MOTOR TEMPERATURE
        ================================================== -->

        <div class="card temperature-card">

            <h2>MOTOR TEMPERATURE</h2>

            <div class="temperature-value"
                 id="motorTemperature">

                --

            </div>

            <div class="temperature-unit">

                °C

            </div>

        </div>


        <!-- =================================================
             LIVE MAP
        ================================================== -->

        <div class="card map-card">

            <h2>LIVE MAP</h2>

            <div id="map"></div>


            <!-- MAP DATA -->

            <div class="map-info">


                <!-- LONGITUDE -->

                <div class="map-info-item">

                    <div class="map-info-label">
                        LONG
                    </div>

                    <div class="map-info-value"
                         id="lon">

                        --

                    </div>

                </div>


                <!-- LATITUDE -->

                <div class="map-info-item">

                    <div class="map-info-label">
                        LAT
                    </div>

                    <div class="map-info-value"
                         id="lat">

                        --

                    </div>

                </div>


                <!-- ALTITUDE -->

                <div class="map-info-item">

                    <div class="map-info-label">
                        ALT
                    </div>

                    <div class="map-info-value"
                         id="altitude">

                        --

                    </div>

                </div>


                <!-- DISTANCE -->

                <div class="map-info-item">

                    <div class="map-info-label">
                        DIST (m)
                    </div>

                    <div class="map-info-value"
                         id="distance">

                        --

                    </div>

                </div>


            </div>

        </div>


    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        // ====================================================
        // SOCKET.IO
        // ====================================================

        const socket = io();


        // ====================================================
        // DEFAULT MAP LOCATION
        // KCT / Coimbatore
        // ====================================================

        const defaultLat = 11.0789;

        const defaultLon = 76.9860;


        // ====================================================
        // CREATE MAP
        // ====================================================

        const map = L.map("map", {

            zoomControl: true,

            scrollWheelZoom: true,

            doubleClickZoom: true,

            dragging: true,

            touchZoom: true,

            boxZoom: true,

            keyboard: true

        }).setView(

            [defaultLat, defaultLon],

            19

        );


        // ====================================================
        // OPENSTREETMAP
        // ====================================================

        L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {

                maxZoom: 21,

                minZoom: 1,

                attribution:
                    "&copy; OpenStreetMap"

            }

        ).addTo(map);


        // ====================================================
        // VEHICLE MARKER
        // ====================================================

        let marker = L.marker(

            [defaultLat, defaultLon]

        ).addTo(map);


        // ====================================================
        // VEHICLE ROUTE
        // ====================================================

        let route = [];


        const polyline = L.polyline(

            route,

            {

                color: "lime",

                weight: 4,

                opacity: 0.8

            }

        ).addTo(map);


        // ====================================================
        // TELEMETRY
        // ====================================================

        socket.on("telemetry", (data) => {


            // ------------------------------------------------
            // SPEED
            // ------------------------------------------------

            if (data.speed !== undefined) {

                document.getElementById(
                    "speed"
                ).textContent =

                    Number(data.speed)
                    .toFixed(2);
            }


            // ------------------------------------------------
            // ACCELERATION
            // ------------------------------------------------

            if (data.acceleration !== undefined) {

                document.getElementById(
                    "acceleration"
                ).textContent =

                    Number(data.acceleration)
                    .toFixed(2);
            }


            // ------------------------------------------------
            // SLOPE
            // ------------------------------------------------

            if (data.slope !== undefined) {

                document.getElementById(
                    "slope"
                ).textContent =

                    Number(data.slope)
                    .toFixed(2);
            }


            // ------------------------------------------------
            // DECELERATION
            // ------------------------------------------------

            if (data.deceleration !== undefined) {

                document.getElementById(
                    "deceleration"
                ).textContent =

                    Number(data.deceleration)
                    .toFixed(2);
            }


            // ------------------------------------------------
            // MOTOR TEMPERATURE
            // ------------------------------------------------

            if (data.motor_temperature !== undefined) {

                document.getElementById(
                    "motorTemperature"
                ).textContent =

                    Number(data.motor_temperature)
                    .toFixed(2);
            }


            // ------------------------------------------------
            // LATITUDE
            // ------------------------------------------------

            if (data.lat !== undefined) {

                document.getElementById(
                    "lat"
                ).textContent =

                    Number(data.lat)
                    .toFixed(6) + "°";
            }


            // ------------------------------------------------
            // LONGITUDE
            // ------------------------------------------------

            if (data.lon !== undefined) {

                document.getElementById(
                    "lon"
                ).textContent =

                    Number(data.lon)
                    .toFixed(6) + "°";
            }


            // ------------------------------------------------
            // ALTITUDE
            // ------------------------------------------------

            if (data.altitude !== undefined) {

                document.getElementById(
                    "altitude"
                ).textContent =

                    Number(data.altitude)
                    .toFixed(2) + " m";
            }


            // ------------------------------------------------
            // DISTANCE
            // ------------------------------------------------

            if (data.distance !== undefined) {

                document.getElementById(
                    "distance"
                ).textContent =

                    Number(data.distance)
                    .toFixed(2);
            }


            // =================================================
            // UPDATE MAP
            // =================================================

            if (
                data.lat !== undefined &&
                data.lon !== undefined
            ) {


                const latitude =
                    Number(data.lat);


                const longitude =
                    Number(data.lon);


                // ------------------------------------------------
                // Validate GPS coordinates
                // ------------------------------------------------

                if (
                    !isNaN(latitude) &&
                    !isNaN(longitude) &&
                    latitude >= -90 &&
                    latitude <= 90 &&
                    longitude >= -180 &&
                    longitude <= 180
                ) {


                    // --------------------------------------------
                    // Move marker
                    // --------------------------------------------

                    marker.setLatLng(

                        [
                            latitude,
                            longitude
                        ]

                    );


                    // --------------------------------------------
                    // Add point to route
                    // --------------------------------------------

                    route.push(

                        [
                            latitude,
                            longitude
                        ]

                    );


                    // --------------------------------------------
                    // Update route
                    // --------------------------------------------

                    polyline.setLatLngs(route);


                    // --------------------------------------------
                    // Follow vehicle
                    // --------------------------------------------

                    map.panTo(

                        [
                            latitude,
                            longitude
                        ],

                        {

                            animate: true,

                            duration: 0.5

                        }

                    );

                }

            }

        });


    </script>


</body>

</html>
