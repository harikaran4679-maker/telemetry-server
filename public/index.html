<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Team Renew Telemetry</title>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {

            background: #111;

            color: white;

            padding: 30px;

            min-height: 100vh;
        }


        h1 {

            color: #00aaff;

            font-size: 40px;

            margin-bottom: 30px;
        }


        .dashboard {

            position: relative;

            width: 100%;

            min-height: 700px;
        }


        .card {

            background: #1f1f1f;

            border-radius: 12px;

            border: 1px solid rgba(0, 170, 255, 0.12);

            box-shadow:
                0 0 12px rgba(0, 170, 255, 0.15);
        }


        /* =====================================================
           SPEED
           ===================================================== */

        .speed-card {

            position: absolute;

            left: 23%;

            top: 0;

            width: 230px;

            height: 150px;

            text-align: center;

            padding: 22px;
        }


        .speed-card h2 {

            color: #00aaff;

            font-size: 18px;

            margin-bottom: 15px;
        }


        .speed-value {

            font-size: 35px;

            font-weight: bold;
        }


        .speed-unit {

            color: #aaa;

            font-size: 14px;

            margin-top: 5px;
        }


        /* =====================================================
           DYNAMICS
           ===================================================== */

        .dynamics-row {

            position: absolute;

            left: 2%;

            top: 155px;

            width: 52%;

            display: flex;

            gap: 12px;
        }


        .small-card {

            flex: 1;

            height: 110px;

            text-align: center;

            padding: 18px 8px;
        }


        .small-card h2 {

            color: #00aaff;

            font-size: 15px;

            margin-bottom: 12px;
        }


        .small-value {

            font-size: 27px;

            font-weight: bold;
        }


        .small-unit {

            color: #aaa;

            font-size: 13px;

            margin-top: 5px;
        }


        /* =====================================================
           CONNECTION STATUS
           ===================================================== */

        .map-status {

            position: absolute;

            right: 14%;

            top: -25px;

            font-size: 14px;

            font-weight: bold;

            text-align: center;

            color: #ff4444;
        }


        /* =====================================================
           MAP CARD
           ===================================================== */

        .map-card {

            position: absolute;

            right: 2%;

            top: 0;

            width: 410px;

            height: 590px;

            padding: 18px;
        }


        .map-card h2 {

            color: #00aaff;

            font-size: 20px;

            margin-bottom: 15px;

            padding-bottom: 10px;

            border-bottom: 1px solid #333;
        }


        #map {

            width: 100%;

            height: 400px;

            border-radius: 10px;

            overflow: hidden;
        }


        /* =====================================================
           MAP INFORMATION
           ===================================================== */

        .map-info {

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            margin-top: 10px;

            background: #151515;

            border-radius: 8px;

            overflow: hidden;
        }


        .map-info-item {

            text-align: center;

            padding: 10px 4px;

            border-right: 1px solid #333;
        }


        .map-info-item:last-child {

            border-right: none;
        }


        .map-info-label {

            color: #aaa;

            font-size: 12px;

            margin-bottom: 6px;
        }


        .map-info-value {

            color: white;

            font-size: 13px;

            font-weight: bold;

            white-space: nowrap;
        }


        /* =====================================================
           SLOPE
           ===================================================== */

        .slope-card {

            position: absolute;

            right: 12%;

            top: 610px;

            width: 150px;

            height: 80px;

            text-align: center;

            padding: 12px;
        }


        .slope-card h2 {

            color: #00aaff;

            font-size: 14px;

            margin-bottom: 8px;
        }


        .slope-value {

            font-size: 24px;

            font-weight: bold;
        }


        .slope-unit {

            color: #aaa;

            font-size: 11px;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 1000px) {

            .dashboard {

                position: static;

                display: flex;

                flex-direction: column;

                gap: 20px;
            }


            .speed-card,
            .dynamics-row,
            .map-card,
            .slope-card,
            .map-status {

                position: static;

                width: 100%;
            }


            .dynamics-row {

                display: flex;
            }


            .map-card {

                max-width: 600px;

                height: auto;
            }


            #map {

                height: 400px;
            }


            .map-status {

                text-align: left;

                margin-bottom: -10px;
            }
        }


        @media (max-width: 600px) {

            body {

                padding: 15px;
            }


            h1 {

                font-size: 28px;
            }


            .dynamics-row {

                flex-direction: column;
            }


            .map-info {

                grid-template-columns: repeat(2, 1fr);
            }
        }

    </style>

</head>


<body>


    <h1>TEAM RENEW TELEMETRY</h1>


    <div class="dashboard">


        <!-- =================================================
             SPEED
             ================================================= -->

        <div class="card speed-card">

            <h2>SPEED</h2>

            <div class="speed-value"
                 id="speed">

                --

            </div>

            <div class="speed-unit">

                km/h

            </div>

        </div>


        <!-- =================================================
             ACCELERATION / TEMPERATURE / DECELERATION
             ================================================= -->

        <div class="dynamics-row">


            <!-- ACCELERATION -->

            <div class="card small-card">

                <h2>ACCELERATION</h2>

                <div class="small-value"
                     id="acceleration">

                    --

                </div>

                <div class="small-unit">

                    m/s²

                </div>

            </div>


            <!-- TEMPERATURE -->

            <div class="card small-card">

                <h2>TEMPERATURE</h2>

                <div class="small-value"
                     id="motorTemperature">

                    --

                </div>

                <div class="small-unit">

                    °C

                </div>

            </div>


            <!-- DECELERATION -->

            <div class="card small-card">

                <h2>DECELERATION</h2>

                <div class="small-value"
                     id="deceleration">

                    --

                </div>

                <div class="small-unit">

                    m/s²

                </div>

            </div>


        </div>


        <!-- =================================================
             CONNECTION STATUS
             ================================================= -->

        <div class="map-status"
             id="connectionStatus">

            DISCONNECTED

        </div>


        <!-- =================================================
             LIVE MAP
             ================================================= -->

        <div class="card map-card">

            <h2>LIVE MAP</h2>

            <div id="map"></div>


            <div class="map-info">


                <!-- LONGITUDE -->

                <div class="map-info-item">

                    <div class="map-info-label">

                        LONG

                    </div>

                    <div class="map-info-value"
                         id="lon">

                        --

                    </div>

                </div>


                <!-- LATITUDE -->

                <div class="map-info-item">

                    <div class="map-info-label">

                        LAT

                    </div>

                    <div class="map-info-value"
                         id="lat">

                        --

                    </div>

                </div>


                <!-- ALTITUDE -->

                <div class="map-info-item">

                    <div class="map-info-label">

                        ALT

                    </div>

                    <div class="map-info-value"
                         id="altitude">

                        --

                    </div>

                </div>


                <!-- DISTANCE -->

                <div class="map-info-item">

                    <div class="map-info-label">

                        DIST (m)

                    </div>

                    <div class="map-info-value"
                         id="distance">

                        --

                    </div>

                </div>


            </div>

        </div>


        <!-- =================================================
             SLOPE
             ================================================= -->

        <div class="card slope-card">

            <h2>SLOPE</h2>

            <div class="slope-value"
                 id="slope">

                --

            </div>

            <div class="slope-unit">

                degrees

            </div>

        </div>


    </div>


    <script>

        // ====================================================
        // SOCKET.IO
        // ====================================================

        const socket = io();


        // ====================================================
        // DOM ELEMENTS
        // ====================================================

        const speedElement =
            document.getElementById("speed");

        const accelerationElement =
            document.getElementById("acceleration");

        const temperatureElement =
            document.getElementById("motorTemperature");

        const decelerationElement =
            document.getElementById("deceleration");

        const slopeElement =
            document.getElementById("slope");

        const longitudeElement =
            document.getElementById("lon");

        const latitudeElement =
            document.getElementById("lat");

        const altitudeElement =
            document.getElementById("altitude");

        const distanceElement =
            document.getElementById("distance");

        const connectionStatus =
            document.getElementById("connectionStatus");


        // ====================================================
        // TELEMETRY TIMEOUT
        // ====================================================

        let lastTelemetryTime = 0;

        const TELEMETRY_TIMEOUT = 3000;


        // ====================================================
        // CONNECTION STATUS
        // ====================================================

        function updateConnectionStatus() {

            const now = Date.now();

            if (

                lastTelemetryTime !== 0 &&

                (now - lastTelemetryTime)
                    <= TELEMETRY_TIMEOUT

            ) {

                connectionStatus.textContent =
                    "CONNECTED";

                connectionStatus.style.color =
                    "#00aaff";

            }

            else {

                connectionStatus.textContent =
                    "DISCONNECTED";

                connectionStatus.style.color =
                    "#ff4444";

            }

        }


        setInterval(
            updateConnectionStatus,
            500
        );


        // ====================================================
        // MAP DEFAULT LOCATION
        // ====================================================

        const defaultLat = 11.0789;

        const defaultLon = 76.9860;


        // ====================================================
        // CREATE MAP
        // ====================================================

        const map = L.map("map", {

            zoomControl: true,

            scrollWheelZoom: true,

            doubleClickZoom: true,

            dragging: true,

            touchZoom: true,

            boxZoom: true,

            keyboard: true

        }).setView(

            [
                defaultLat,
                defaultLon
            ],

            19

        );


        // ====================================================
        // OPEN STREET MAP
        // ====================================================

        L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {

                maxZoom: 21,

                minZoom: 1,

                attribution:
                    "&copy; OpenStreetMap"

            }

        ).addTo(map);


        // ====================================================
        // VEHICLE MARKER
        // ====================================================

        const marker = L.marker(

            [
                defaultLat,
                defaultLon
            ]

        ).addTo(map);


        // ====================================================
        // VEHICLE ROUTE
        // ====================================================

        let route = [];


        const polyline = L.polyline(

            route,

            {

                color: "#00aaff",

                weight: 4,

                opacity: 0.8

            }

        ).addTo(map);


        // ====================================================
        // SOCKET CONNECTED
        // ====================================================

        socket.on("connect", () => {

            console.log(
                "Socket.IO connected"
            );

        });


        // ====================================================
        // SOCKET DISCONNECTED
        // ====================================================

        socket.on("disconnect", () => {

            console.log(
                "Socket.IO disconnected"
            );

        });


        // ====================================================
        // RECEIVE TELEMETRY
        // ====================================================

        socket.on(
            "telemetry",
            (data) => {

                console.log(
                    "Telemetry received:",
                    data
                );


                // ============================================
                // UPDATE TELEMETRY TIME
                // ============================================

                lastTelemetryTime =
                    Date.now();


                // ============================================
                // SPEED
                // ESP32:
                // speed_kmh
                // ============================================

                if (
                    data.speed_kmh !== undefined
                ) {

                    speedElement.textContent =

                        Number(
                            data.speed_kmh
                        ).toFixed(2);

                }


                // ============================================
                // ACCELERATION
                // ESP32:
                // accel
                // ============================================

                if (
                    data.accel !== undefined
                ) {

                    accelerationElement.textContent =

                        Number(
                            data.accel
                        ).toFixed(2);

                }


                // ============================================
                // TEMPERATURE
                // ESP32:
                // ds18b20_temp
                // ============================================

                if (
                    data.ds18b20_temp !== undefined
                ) {

                    temperatureElement.textContent =

                        Number(
                            data.ds18b20_temp
                        ).toFixed(2);

                }


                // ============================================
                // DECELERATION
                // ESP32:
                // decel
                // ============================================

                if (
                    data.decel !== undefined
                ) {

                    decelerationElement.textContent =

                        Number(
                            data.decel
                        ).toFixed(2);

                }


                // ============================================
                // SLOPE
                // ESP32:
                // slope
                // ============================================

                if (
                    data.slope !== undefined
                ) {

                    slopeElement.textContent =

                        Number(
                            data.slope
                        ).toFixed(2);

                }


                // ============================================
                // GPS
                //
                // ESP32 JSON:
                //
                // "gps":{
                //    "lat":...,
                //    "lon":...,
                //    "alt":...
                // }
                // ============================================

                if (
                    data.gps !== undefined &&
                    data.gps !== null
                ) {


                    // ========================================
                    // LATITUDE
                    // ========================================

                    if (
                        data.gps.lat !== undefined
                    ) {

                        const latitude =
                            Number(
                                data.gps.lat
                            );

                        if (
                            !isNaN(latitude)
                        ) {

                            latitudeElement.textContent =

                                latitude.toFixed(6)
                                + "°";

                        }

                    }


                    // ========================================
                    // LONGITUDE
                    // ========================================

                    if (
                        data.gps.lon !== undefined
                    ) {

                        const longitude =
                            Number(
                                data.gps.lon
                            );

                        if (
                            !isNaN(longitude)
                        ) {

                            longitudeElement.textContent =

                                longitude.toFixed(6)
                                + "°";

                        }

                    }


                    // ========================================
                    // ALTITUDE
                    // ========================================

                    if (
                        data.gps.alt !== undefined
                    ) {

                        const altitude =
                            Number(
                                data.gps.alt
                            );

                        if (
                            !isNaN(altitude)
                        ) {

                            altitudeElement.textContent =

                                altitude.toFixed(2)
                                + " m";

                        }

                    }


                    // ========================================
                    // UPDATE MAP
                    // ========================================

                    const latitude =
                        Number(
                            data.gps.lat
                        );

                    const longitude =
                        Number(
                            data.gps.lon
                        );


                    if (

                        !isNaN(latitude) &&

                        !isNaN(longitude) &&

                        latitude >= -90 &&

                        latitude <= 90 &&

                        longitude >= -180 &&

                        longitude <= 180

                    ) {


                        // Move marker

                        marker.setLatLng(

                            [
                                latitude,
                                longitude
                            ]

                        );


                        // Add route point

                        route.push(

                            [
                                latitude,
                                longitude
                            ]

                        );


                        // Prevent route from
                        // becoming excessively large

                        if (
                            route.length > 5000
                        ) {

                            route.shift();

                        }


                        // Update route

                        polyline.setLatLngs(
                            route
                        );


                        // Follow vehicle

                        map.panTo(

                            [
                                latitude,
                                longitude
                            ],

                            {

                                animate: true,

                                duration: 0.5

                            }

                        );

                    }

                }


                // ============================================
                // DISTANCE
                // ESP32:
                // distance_m
                // ============================================

                if (
                    data.distance_m !== undefined
                ) {

                    distanceElement.textContent =

                        Number(
                            data.distance_m
                        ).toFixed(2);

                }

            }
        );


    </script>


</body>

</html>
