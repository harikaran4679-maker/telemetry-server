<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Renew Telemetry</title>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Leaflet -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#111;
            color:white;
            padding:30px;
        }

        h1{
            color:#00ff88;
            margin-bottom:30px;
            font-size:40px;
        }

        .dashboard{
            display:flex;
            flex-wrap:wrap;
            gap:20px;
        }

        .card{
            background:#1f1f1f;
            border-radius:12px;
            padding:20px;
            box-shadow:0 0 12px rgba(0,255,136,.15);
        }

        .gps-card{
            width:320px;
        }

        .map-card{
            width:700px;
        }

        .card h2{
            color:#00ff88;
            margin-bottom:18px;
            border-bottom:1px solid #333;
            padding-bottom:10px;
        }

        .data-row{
            display:flex;
            justify-content:space-between;
            margin:14px 0;
            font-size:18px;
        }

        .label{
            color:#bbbbbb;
        }

        .value{
            color:white;
            font-weight:bold;
        }

        #map{
            width:100%;
            height:500px;
            border-radius:10px;
        }

    </style>

</head>

<body>

<h1>TEAM RENEW TELEMETRY</h1>

<div class="dashboard">

    <!-- GPS CARD -->

    <div class="card gps-card">

        <h2>GPS</h2>

        <div class="data-row">
            <span class="label">Vehicle</span>
            <span class="value" id="vehicle">-</span>
        </div>

        <div class="data-row">
            <span class="label">Latitude</span>
            <span class="value" id="lat">-</span>
        </div>

        <div class="data-row">
            <span class="label">Longitude</span>
            <span class="value" id="lon">-</span>
        </div>

        <div class="data-row">
            <span class="label">Altitude</span>
            <span class="value" id="altitude">-</span>
        </div>

        <div class="data-row">
            <span class="label">Speed</span>
            <span class="value" id="speed">-</span>
        </div>

    </div>

    <!-- MAP -->

    <div class="card map-card">

        <h2>LIVE MAP</h2>

        <div id="map"></div>

    </div>

</div>

<script>

const socket = io();

// Default location (KCT, Coimbatore)
const map = L.map('map').setView([11.0789,76.9860],18);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap'
}).addTo(map);

// Vehicle marker
let marker = L.marker([11.0789,76.9860]).addTo(map);

// Vehicle route
let route = [];

let polyline = L.polyline(route,{
    color:'lime',
    weight:4
}).addTo(map);

// Receive live telemetry
socket.on("telemetry",(data)=>{

    document.getElementById("vehicle").textContent = data.vehicle;

    document.getElementById("lat").textContent =
        Number(data.lat).toFixed(7) + "°";

    document.getElementById("lon").textContent =
        Number(data.lon).toFixed(7) + "°";

    document.getElementById("altitude").textContent =
        Number(data.altitude).toFixed(2) + " m";

    document.getElementById("speed").textContent =
        Number(data.speed).toFixed(2) + " km/h";

    marker.setLatLng([data.lat,data.lon]);

    map.panTo([data.lat,data.lon]);

    route.push([data.lat,data.lon]);

    polyline.setLatLngs(route);

});

</script>

</body>

</html>
