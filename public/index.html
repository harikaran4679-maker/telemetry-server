<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <title>Team Renew Telemetry</title>

    <script src="/socket.io/socket.io.js"></script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#111;
            color:white;
            padding:30px;
        }

        h1{
            color:#00ff88;
            margin-bottom:30px;
            font-size:42px;
        }

        .dashboard{
            display:flex;
            flex-wrap:wrap;
            gap:20px;
        }

        .card{
            background:#1f1f1f;
            border-radius:12px;
            padding:20px;
            width:320px;
            box-shadow:0 0 12px rgba(0,255,136,0.15);
        }

        .card h2{
            color:#00ff88;
            margin-bottom:18px;
            border-bottom:1px solid #333;
            padding-bottom:10px;
        }

        .data-row{
            display:flex;
            justify-content:space-between;
            margin:12px 0;
            font-size:18px;
        }

        .label{
            color:#bbbbbb;
        }

        .value{
            color:white;
            font-weight:bold;
        }

    </style>

</head>

<body>

<h1>TEAM RENEW TELEMETRY</h1>

<div class="dashboard">

    <div class="card">

        <h2>GPS</h2>

        <div class="data-row">
            <span class="label">Vehicle</span>
            <span class="value" id="vehicle">-</span>
        </div>

        <div class="data-row">
            <span class="label">Latitude</span>
            <span class="value" id="lat">-</span>
        </div>

        <div class="data-row">
            <span class="label">Longitude</span>
            <span class="value" id="lon">-</span>
        </div>

        <div class="data-row">
            <span class="label">Altitude</span>
            <span class="value" id="altitude">-</span>
        </div>

        <div class="data-row">
            <span class="label">Speed</span>
            <span class="value" id="speed">-</span>
        </div>

    </div>

</div>

<script>

const socket = io();

socket.on("telemetry", (data)=>{

    document.getElementById("vehicle").textContent = data.vehicle ?? "-";
    document.getElementById("lat").textContent = data.lat ?? "-";
    document.getElementById("lon").textContent = data.lon ?? "-";
    document.getElementById("altitude").textContent = data.altitude ?? "-";
    document.getElementById("speed").textContent = data.speed ?? "-";

});

</script>

</body>

</html>
