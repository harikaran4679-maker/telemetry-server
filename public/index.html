<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Renew Telemetry</title>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {
            background: #111;
            color: white;
            padding: 30px;
            min-height: 100vh;
        }


        /* =========================
           TITLE
        ========================= */

        h1 {
            color: #00ff88;
            font-size: 40px;
            margin-bottom: 30px;
        }


        /* =========================
           MAIN DASHBOARD
        ========================= */

        .dashboard {
            position: relative;
            width: 100%;
            min-height: 600px;
        }


        /* =========================
           SPEED CARD
        ========================= */

        .speed-card {

            position: absolute;

            left: 25%;
            top: 40px;

            width: 230px;
            height: 120px;

            background: #1f1f1f;

            border-radius: 12px;

            box-shadow:
                0 0 12px rgba(0,255,136,0.15);

            padding: 20px;

            text-align: center;
        }


        .speed-card h2 {

            color: #00ff88;

            font-size: 18px;

            margin-bottom: 15px;
        }


        .speed-value {

            font-size: 32px;

            font-weight: bold;

            color: white;
        }


        /* =========================
           MAP CARD
        ========================= */

        .map-card {

            position: absolute;

            right: 5%;
            top: 0;

            width: 470px;

            background: #1f1f1f;

            border-radius: 12px;

            padding: 18px;

            box-shadow:
                0 0 12px rgba(0,255,136,0.15);
        }


        .map-card h2 {

            color: #00ff88;

            font-size: 22px;

            margin-bottom: 12px;

            border-bottom: 1px solid #333;

            padding-bottom: 10px;
        }


        /* =========================
           MAP
        ========================= */

        #map {

            width: 100%;

            height: 400px;

            border-radius: 10px;
        }


        /* =========================
           GPS BOTTOM VALUES
        ========================= */

        .map-data {

            display: flex;

            justify-content: space-around;

            align-items: center;

            background: #181818;

            border-radius: 0 0 12px 12px;

            margin-top: 10px;

            padding: 12px 5px;
        }


        .map-data-item {

            text-align: center;

            flex: 1;
        }


        .map-data-item:not(:last-child) {

            border-right: 1px solid #333;
        }


        .map-label {

            display: block;

            color: #999;

            font-size: 13px;

            margin-bottom: 5px;
        }


        .map-value {

            display: block;

            color: white;

            font-weight: bold;

            font-size: 15px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .dashboard {

                min-height: auto;

                display: flex;

                flex-direction: column;

                align-items: center;

                gap: 25px;
            }


            .speed-card {

                position: static;

            }


            .map-card {

                position: static;

                width: min(470px, 100%);
            }
        }

    </style>

</head>


<body>


<h1>TEAM RENEW TELEMETRY</h1>


<div class="dashboard">


    <!-- =========================
         SPEED
    ========================= -->

    <div class="speed-card">

        <h2>SPEED KM/HRS</h2>

        <div class="speed-value">

            <span id="speed">0.00</span>

        </div>

    </div>



    <!-- =========================
         LIVE MAP
    ========================= -->

    <div class="map-card">

        <h2>LIVE MAP</h2>

        <div id="map"></div>


        <!-- GPS VALUES UNDER MAP -->

        <div class="map-data">


            <!-- LONGITUDE -->

            <div class="map-data-item">

                <span class="map-label">
                    LONG
                </span>

                <span
                    class="map-value"
                    id="lon">
                    -
                </span>

            </div>


            <!-- LATITUDE -->

            <div class="map-data-item">

                <span class="map-label">
                    LAT
                </span>

                <span
                    class="map-value"
                    id="lat">
                    -
                </span>

            </div>


            <!-- ALTITUDE -->

            <div class="map-data-item">

                <span class="map-label">
                    ALT
                </span>

                <span
                    class="map-value"
                    id="altitude">
                    -
                </span>

            </div>


        </div>

    </div>


</div>



<script>


/* =====================================
   SOCKET.IO
===================================== */

const socket = io();



/* =====================================
   LEAFLET MAP
===================================== */

const map = L.map('map').setView(
    [11.0789, 76.9860],
    20
);



/* =====================================
   OPEN STREET MAP
===================================== */

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '© OpenStreetMap'
    }
).addTo(map);



/* =====================================
   VEHICLE MARKER
===================================== */

let marker = L.marker(
    [11.0789, 76.9860]
).addTo(map);



/* =====================================
   VEHICLE ROUTE
===================================== */

let route = [];

let polyline = L.polyline(
    route,
    {
        color: 'lime',
        weight: 4
    }
).addTo(map);



/* =====================================
   RECEIVE TELEMETRY
===================================== */

socket.on("telemetry", (data) => {


    const lat = Number(data.lat);

    const lon = Number(data.lon);

    const altitude = Number(data.altitude);

    const speed = Number(data.speed);



    /* SPEED */

    document.getElementById("speed").textContent =
        speed.toFixed(2);



    /* LATITUDE */

    document.getElementById("lat").textContent =
        lat.toFixed(6) + "°";



    /* LONGITUDE */

    document.getElementById("lon").textContent =
        lon.toFixed(6) + "°";



    /* ALTITUDE */

    document.getElementById("altitude").textContent =
        altitude.toFixed(2) + " m";



    /* MOVE VEHICLE */

    marker.setLatLng([
        lat,
        lon
    ]);



    /* CENTER MAP ON VEHICLE */

    map.setView(
        [lat, lon],
        20
    );



    /* ADD ROUTE */

    route.push([
        lat,
        lon
    ]);



    polyline.setLatLngs(route);

});

</script>


</body>

</html>
