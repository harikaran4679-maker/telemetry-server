<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Team Renew Telemetry</title>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {
            background: #111;
            color: white;
            padding: 30px;
        }


        /* =====================================================
           MAIN TITLE
        ===================================================== */

        h1 {
            color: #00ff88;
            font-size: 40px;
            margin-bottom: 35px;
        }


        /* =====================================================
           MAIN DASHBOARD
        ===================================================== */

        .dashboard {
            display: grid;

            grid-template-columns:
                minmax(500px, 1fr)
                500px;

            gap: 30px;

            align-items: start;
        }


        /* =====================================================
           LEFT SIDE
        ===================================================== */

        .left-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =====================================================
           SPEED CARD
        ===================================================== */

        .speed-card {

            width: 230px;

            background: #1f1f1f;

            border-radius: 12px;

            padding: 20px;

            text-align: center;

            box-shadow:
                0 0 12px rgba(0,255,136,0.15);

            margin-bottom: 25px;
        }


        .speed-title {

            color: #00ff88;

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 12px;
        }


        .speed-value {

            font-size: 34px;

            font-weight: bold;

            color: white;
        }


        .speed-unit {

            font-size: 14px;

            color: #bbbbbb;

            margin-top: 5px;
        }


        /* =====================================================
           DYNAMIC VALUES ROW
        ===================================================== */

        .dynamic-row {

            width: 100%;

            max-width: 650px;

            display: grid;

            grid-template-columns:
                1fr
                1fr
                1fr;

            gap: 15px;
        }


        .dynamic-card {

            background: #1f1f1f;

            border-radius: 12px;

            padding: 18px 10px;

            text-align: center;

            box-shadow:
                0 0 12px rgba(0,255,136,0.15);
        }


        .dynamic-title {

            color: #00ff88;

            font-size: 15px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .dynamic-value {

            color: white;

            font-size: 25px;

            font-weight: bold;
        }


        .dynamic-unit {

            color: #999;

            font-size: 12px;

            margin-top: 5px;
        }


        /* =====================================================
           MAP CARD
        ===================================================== */

        .map-card {

            background: #1f1f1f;

            border-radius: 12px;

            padding: 18px;

            box-shadow:
                0 0 12px rgba(0,255,136,0.15);

            width: 500px;
        }


        .map-title {

            color: #00ff88;

            font-size: 22px;

            font-weight: bold;

            padding-bottom: 12px;

            margin-bottom: 12px;

            border-bottom: 1px solid #333;
        }


        /* =====================================================
           MAP
        ===================================================== */

        #map {

            width: 100%;

            height: 420px;

            border-radius: 10px;

            overflow: hidden;
        }


        /* =====================================================
           MAP DATA BAR
        ===================================================== */

        .map-data {

            display: grid;

            grid-template-columns:
                1fr
                1fr
                1fr
                1fr;

            margin-top: 10px;

            background: #151515;

            border-radius: 8px;

            overflow: hidden;
        }


        .map-data-item {

            text-align: center;

            padding: 12px 5px;

            border-right: 1px solid #333;
        }


        .map-data-item:last-child {

            border-right: none;
        }


        .map-data-label {

            color: #bbbbbb;

            font-size: 12px;

            margin-bottom: 5px;
        }


        .map-data-value {

            color: white;

            font-size: 14px;

            font-weight: bold;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 1000px) {

            .dashboard {

                grid-template-columns: 1fr;

            }

            .map-card {

                width: 100%;

                max-width: 600px;

            }

            .left-panel {

                width: 100%;

            }

        }


        @media (max-width: 600px) {

            body {

                padding: 15px;

            }

            h1 {

                font-size: 30px;

            }

            .dynamic-row {

                grid-template-columns: 1fr;

            }

            .map-data {

                grid-template-columns:
                    1fr
                    1fr;

            }

        }

    </style>

</head>


<body>


<h1>TEAM RENEW TELEMETRY</h1>


<div class="dashboard">


    <!-- =====================================================
         LEFT PANEL
    ====================================================== -->

    <div class="left-panel">


        <!-- SPEED -->

        <div class="speed-card">

            <div class="speed-title">
                SPEED
            </div>

            <div class="speed-value"
                 id="speed">

                0.00

            </div>

            <div class="speed-unit">
                km/h
            </div>

        </div>



        <!-- ACCELERATION / SLOPE / DECELERATION -->

        <div class="dynamic-row">


            <!-- ACCELERATION -->

            <div class="dynamic-card">

                <div class="dynamic-title">
                    ACCELERATION
                </div>

                <div class="dynamic-value"
                     id="acceleration">

                    0.00

                </div>

                <div class="dynamic-unit">
                    m/s²
                </div>

            </div>


            <!-- SLOPE -->

            <div class="dynamic-card">

                <div class="dynamic-title">
                    SLOPE
                </div>

                <div class="dynamic-value"
                     id="slope">

                    0.00

                </div>

                <div class="dynamic-unit">
                    degrees
                </div>

            </div>


            <!-- DECELERATION -->

            <div class="dynamic-card">

                <div class="dynamic-title">
                    DECELERATION
                </div>

                <div class="dynamic-value"
                     id="deceleration">

                    0.00

                </div>

                <div class="dynamic-unit">
                    m/s²
                </div>

            </div>


        </div>


    </div>



    <!-- =====================================================
         RIGHT SIDE MAP
    ====================================================== -->

    <div class="map-card">


        <div class="map-title">
            LIVE MAP
        </div>


        <div id="map"></div>


        <!-- MAP DATA -->

        <div class="map-data">


            <!-- LONGITUDE -->

            <div class="map-data-item">

                <div class="map-data-label">
                    LONG
                </div>

                <div class="map-data-value"
                     id="lon">

                    -

                </div>

            </div>


            <!-- LATITUDE -->

            <div class="map-data-item">

                <div class="map-data-label">
                    LAT
                </div>

                <div class="map-data-value"
                     id="lat">

                    -

                </div>

            </div>


            <!-- ALTITUDE -->

            <div class="map-data-item">

                <div class="map-data-label">
                    ALT
                </div>

                <div class="map-data-value"
                     id="altitude">

                    -

                </div>

            </div>


            <!-- DISTANCE -->

            <div class="map-data-item">

                <div class="map-data-label">
                    DIST (m)
                </div>

                <div class="map-data-value"
                     id="distance">

                    -

                </div>

            </div>


        </div>


    </div>


</div>



<script>


/* =========================================================
   SOCKET.IO
========================================================= */

const socket = io();



/* =========================================================
   LEAFLET MAP
========================================================= */

const map = L.map("map", {

    zoomControl: true,

    scrollWheelZoom: true,

    doubleClickZoom: true,

    dragging: true

}).setView(
    [11.0789, 76.9860],
    18
);



/* =========================================================
   OPEN STREET MAP
========================================================= */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {

        maxZoom: 21,

        attribution:
            "&copy; OpenStreetMap"

    }
).addTo(map);



/* =========================================================
   VEHICLE MARKER
========================================================= */

let marker = L.marker(
    [11.0789, 76.9860]
).addTo(map);



/* =========================================================
   VEHICLE ROUTE
========================================================= */

let route = [];


let polyline = L.polyline(
    route,
    {

        color: "#00ff88",

        weight: 4,

        opacity: 0.9

    }
).addTo(map);



/* =========================================================
   FIRST GPS POSITION
========================================================= */

let firstPosition = true;



/* =========================================================
   RECEIVE TELEMETRY
========================================================= */

socket.on("telemetry", (data) => {


    /* -----------------------------------------------
       SPEED
    ------------------------------------------------ */

    if (data.speed !== undefined) {

        document.getElementById("speed")
            .textContent =
            Number(data.speed).toFixed(2);

    }



    /* -----------------------------------------------
       ACCELERATION
    ------------------------------------------------ */

    if (data.acceleration !== undefined) {

        document.getElementById("acceleration")
            .textContent =
            Number(data.acceleration).toFixed(2);

    }



    /* -----------------------------------------------
       DECELERATION
    ------------------------------------------------ */

    if (data.deceleration !== undefined) {

        document.getElementById("deceleration")
            .textContent =
            Number(data.deceleration).toFixed(2);

    }



    /* -----------------------------------------------
       SLOPE
    ------------------------------------------------ */

    if (data.slope !== undefined) {

        document.getElementById("slope")
            .textContent =
            Number(data.slope).toFixed(2);

    }



    /* -----------------------------------------------
       LATITUDE
    ------------------------------------------------ */

    if (data.lat !== undefined) {

        document.getElementById("lat")
            .textContent =
            Number(data.lat).toFixed(6) + "°";

    }



    /* -----------------------------------------------
       LONGITUDE
    ------------------------------------------------ */

    if (data.lon !== undefined) {

        document.getElementById("lon")
            .textContent =
            Number(data.lon).toFixed(6) + "°";

    }



    /* -----------------------------------------------
       ALTITUDE
    ------------------------------------------------ */

    if (data.altitude !== undefined) {

        document.getElementById("altitude")
            .textContent =
            Number(data.altitude).toFixed(2) + " m";

    }



    /* -----------------------------------------------
       DISTANCE
    ------------------------------------------------ */

    if (data.distance !== undefined) {

        document.getElementById("distance")
            .textContent =
            Number(data.distance).toFixed(2);

    }



    /* =================================================
       MAP POSITION
    ================================================= */

    if (
        data.lat !== undefined &&
        data.lon !== undefined
    ) {


        const latitude =
            Number(data.lat);

        const longitude =
            Number(data.lon);



        /* ---------------------------------------------
           Validate GPS
        --------------------------------------------- */

        if (
            !isNaN(latitude) &&
            !isNaN(longitude) &&
            latitude >= -90 &&
            latitude <= 90 &&
            longitude >= -180 &&
            longitude <= 180
        ) {


            /* -----------------------------------------
               Move vehicle marker
            ----------------------------------------- */

            marker.setLatLng([
                latitude,
                longitude
            ]);



            /* -----------------------------------------
               Add route
            ----------------------------------------- */

            route.push([
                latitude,
                longitude
            ]);

            polyline.setLatLngs(route);



            /* -----------------------------------------
               Center map ONLY initially
            ----------------------------------------- */

            if (firstPosition) {

                map.setView(
                    [latitude, longitude],
                    19
                );

                firstPosition = false;

            }

        }

    }


});


</script>


</body>

</html>
