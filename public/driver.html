<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#050505"
>

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="Team ReNew"
>

<link
    rel="manifest"
    href="/manifest.json"
>

<title>Team ReNew - Driver Dashboard</title>


<!-- =========================================================
     SOCKET.IO
========================================================= -->

<script src="/socket.io/socket.io.js"></script>


<!-- =========================================================
     LEAFLET
========================================================= -->

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


html,
body {

    width: 100vw;
    height: 100dvh;

    background: #050505;

    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;

    position: fixed;

    inset: 0;

    overscroll-behavior: none;

    user-select: none;
    -webkit-user-select: none;

}


/* =========================================================
   DASHBOARD
========================================================= */

.driver-dashboard {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100dvh;

    padding:
        max(4px, env(safe-area-inset-top))
        max(4px, env(safe-area-inset-right))
        max(4px, env(safe-area-inset-bottom))
        max(4px, env(safe-area-inset-left));

    display: grid;

    grid-template-columns:
        10%
        55%
        35%;

    grid-template-rows:
        13%
        57%
        13%
        17%;

    gap: 4px;

    background: #050505;

    overflow: hidden;

}


/* =========================================================
   COMMON PANEL
========================================================= */

.panel {

    background: #080808;

    border:
        1px solid
        #292929;

    position: relative;

    overflow: hidden;

}


/* =========================================================
   CONNECTION
========================================================= */

.status-panel {

    grid-column: 1;

    grid-row: 1;

    display: flex;

    align-items: center;

    justify-content: center;

}


.connection {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 5px;

    font-size:
        clamp(
            7px,
            1.2vw,
            15px
        );

    font-weight: 900;

    letter-spacing:
        clamp(
            0px,
            0.12vw,
            2px
        );

    white-space: nowrap;

}


.connection-dot {

    width:
        clamp(
            6px,
            0.7vw,
            11px
        );

    height:
        clamp(
            6px,
            0.7vw,
            11px
        );

    border-radius: 50%;

    background: #ff3030;

    box-shadow:
        0 0 10px #ff3030;

}


.connection.connected {

    color: #00ff9d;

}


.connection.connected .connection-dot {

    background: #00ff9d;

    box-shadow:
        0 0 12px #00ff9d;

}


.connection.disconnected {

    color: #ff3030;

}


/* =========================================================
   HEADER
========================================================= */

.title-panel {

    grid-column: 2;

    grid-row: 1;

    display: flex;

    align-items: center;

    justify-content: center;

    border-bottom:
        3px solid
        #00aaff;

}


.title-content {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 100%;
    height: 100%;

    gap:
        clamp(
            5px,
            1vw,
            18px
        );

}


.team-logo {

    width:
        clamp(
            22px,
            4vw,
            55px
        );

    height:
        clamp(
            22px,
            4vw,
            55px
        );

    object-fit: contain;

}


.team-title {

    font-size:
        clamp(
            18px,
            3vw,
            46px
        );

    font-weight: 900;

    letter-spacing:
        clamp(
            1px,
            0.4vw,
            5px
        );

    white-space: nowrap;

}


.team-title span {

    color: #00aaff;

}


/* =========================================================
   RIGHT SIDE
   MAP + SMALL SLOPE AT BOTTOM
========================================================= */

.slope-panel {

    grid-column: 3;

    grid-row: 1 / 5;

    display: flex;

    flex-direction: column;

    align-items: stretch;

    justify-content: flex-start;

}


/* =========================================================
   MAP CONTAINER
========================================================= */

.map-container {

    position: relative;

    width: 100%;

    height: 94%;

    min-height: 0;

    order: 1;

}


/* =========================================================
   MAP HEADER
========================================================= */

.map-header {

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height:
        clamp(
            25px,
            4vh,
            42px
        );

    z-index: 1000;

    display: flex;

    align-items: center;

    padding:
        0
        clamp(
            5px,
            0.8vw,
            12px
        );

    background:
        rgba(
            5,
            5,
            5,
            0.92
        );

    border-bottom:
        1px solid
        #292929;

}


.map-title {

    color: #00aaff;

    font-size:
        clamp(
            8px,
            1.2vw,
            16px
        );

    font-weight: 900;

    letter-spacing:
        clamp(
            1px,
            0.2vw,
            3px
        );

}


/* =========================================================
   MAP
========================================================= */

#map {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

}


/* =========================================================
   SMALL SLOPE BAR - BOTTOM
========================================================= */

.slope-section {

    width: 100%;

    height: 6%;

    min-height: 30px;

    display: flex;

    flex-direction: row;

    align-items: center;

    justify-content: center;

    gap: 8px;

    border-top:
        1px solid
        #292929;

    border-bottom: none;

    background: #080808;

    order: 2;

}


.section-label {

    color: #777;

    font-size:
        clamp(
            7px,
            0.8vw,
            12px
        );

    font-weight: bold;

    letter-spacing:
        clamp(
            1px,
            0.25vw,
            3px
        );

}


.slope-value {

    margin-top: 0;

    color: #00aaff;

    font-size:
        clamp(
            16px,
            1.8vw,
            28px
        );

    font-weight: 900;

    line-height: 1;

}


.data-unit {

    color: #ffffff;

    font-size:
        clamp(
            6px,
            0.65vw,
            10px
        );

    font-weight: bold;

}


/* =========================================================
   THROTTLE
========================================================= */

.throttle-panel {

    grid-column: 1;

    grid-row: 2 / 4;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 5px;

}


.throttle-title {

    color: #777;

    font-size:
        clamp(
            6px,
            0.8vw,
            12px
        );

    font-weight: bold;

    letter-spacing:
        clamp(
            0px,
            0.15vw,
            2px
        );

    margin-bottom: 8px;

}


.throttle-bar {

    position: relative;

    width:
        clamp(
            30px,
            4vw,
            70px
        );

    height: 75%;

    border:
        2px solid
        #333;

    background: #111;

    display: flex;

    align-items: flex-end;

    overflow: hidden;

}


.throttle-fill {

    width: 100%;

    height: 0%;

    background:
        linear-gradient(
            to top,
            #0077ff,
            #00d9ff
        );

    box-shadow:
        0 0 20px
        rgba(
            0,
            170,
            255,
            0.7
        );

    transition:
        height 0.15s linear;

}


.throttle-value {

    position: absolute;

    left: 0;
    right: 0;

    bottom: 8px;

    text-align: center;

    font-size:
        clamp(
            9px,
            1.5vw,
            20px
        );

    font-weight: 900;

    color: #ffffff;

    text-shadow:
        0 0 8px #000;

}


.throttle-label-bottom {

    margin-top: 6px;

    color: #777;

    font-size:
        clamp(
            5px,
            0.7vw,
            10px
        );

    letter-spacing: 1px;

}


/* =========================================================
   CENTER AREA
========================================================= */

.center-area {

    grid-column: 2;

    grid-row: 2 / 5;

    display: grid;

    grid-template-rows:
        48%
        16%
        36%;

    gap: 4px;

    min-width: 0;
    min-height: 0;

}


/* =========================================================
   TOP THREE CARDS
========================================================= */

.top-cards {

    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr;

    gap: 4px;

    min-width: 0;
    min-height: 0;

}


/* =========================================================
   MOTOR CARD
========================================================= */

.motor-card {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: space-evenly;

    padding: 4px;

}


.card-title {

    color: #777;

    font-size:
        clamp(
            7px,
            1vw,
            14px
        );

    font-weight: bold;

    letter-spacing:
        clamp(
            0px,
            0.15vw,
            2px
        );

    text-align: center;

}


.card-value {

    color: #00aaff;

    font-size:
        clamp(
            20px,
            3vw,
            48px
        );

    font-weight: 900;

    line-height: 1;

}


.card-unit {

    color: #888;

    font-size:
        clamp(
            6px,
            0.7vw,
            11px
        );

}


.sub-label {

    color: #777;

    font-size:
        clamp(
            6px,
            0.8vw,
            12px
        );

    margin-top: 3px;

}


.motor-temp {

    color: #ffffff;

    font-size:
        clamp(
            12px,
            1.7vw,
            25px
        );

    font-weight: 900;

}


/* =========================================================
   SPEED CARD
========================================================= */

.speed-card {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    border-top:
        3px solid
        #00aaff;

}


.speed-label {

    color: #777;

    font-size:
        clamp(
            7px,
            1vw,
            15px
        );

    font-weight: bold;

    letter-spacing:
        clamp(
            2px,
            0.5vw,
            7px
        );

}


.speed-value {

    margin-top: 5px;

    color: #ffffff;

    font-size:
        clamp(
            45px,
            8vw,
            130px
        );

    line-height: 0.9;

    font-weight: 900;

    text-shadow:
        0 0 18px
        rgba(
            255,
            255,
            255,
            0.2
        );

}


.speed-unit {

    margin-top: 8px;

    color: #00aaff;

    font-size:
        clamp(
            7px,
            1vw,
            14px
        );

    font-weight: bold;

    letter-spacing: 2px;

}


/* =========================================================
   FUEL CELL CARD
========================================================= */

.fuel-card {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: space-evenly;

    padding: 4px;

}


.fuel-power {

    color: #00ff9d;

    font-size:
        clamp(
            20px,
            3vw,
            48px
        );

    font-weight: 900;

    line-height: 1;

}


.fuel-temp {

    color: #ffffff;

    font-size:
        clamp(
            12px,
            1.7vw,
            25px
        );

    font-weight: 900;

}


/* =========================================================
   TELEMETRY ROW
========================================================= */

.telemetry-row {

    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr;

    gap: 4px;

    min-height: 0;

}


.telemetry-box {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

}


.telemetry-label {

    color: #777;

    font-size:
        clamp(
            6px,
            0.8vw,
            12px
        );

    font-weight: bold;

}


.telemetry-value {

    margin-top: 3px;

    color: #ffffff;

    font-size:
        clamp(
            15px,
            2vw,
            28px
        );

    font-weight: 900;

}


.telemetry-unit {

    color: #888;

    font-size:
        clamp(
            5px,
            0.7vw,
            10px
        );

}


/* =========================================================
   MESSAGE
========================================================= */

.message-panel {

    display: flex;

    align-items: center;

    justify-content: center;

    border-left:
        5px solid
        #00ff9d;

}


.system-message {

    color: #00ff9d;

    font-size:
        clamp(
            10px,
            2vw,
            30px
        );

    font-weight: 900;

    letter-spacing:
        clamp(
            1px,
            0.3vw,
            4px
        );

    text-transform: uppercase;

    text-align: center;

}


.message-panel.warning {

    border-left-color:
        #ff3030;

}


.message-panel.warning
.system-message {

    color: #ff3030;

    animation:
        warningBlink
        0.8s
        infinite
        alternate;

}


@keyframes warningBlink {

    from {
        opacity: 1;
    }

    to {
        opacity: 0.45;
    }

}


/* =========================================================
   LEAFLET
========================================================= */

.leaflet-control-zoom {

    margin-top:
        clamp(
            30px,
            5vh,
            55px
        ) !important;

}


.leaflet-control-zoom a {

    background:
        #111 !important;

    color:
        #ffffff !important;

    border-color:
        #333 !important;

}


.leaflet-control-attribution {

    background:
        rgba(
            0,
            0,
            0,
            0.75
        ) !important;

    color:
        #ffffff !important;

}


.leaflet-control-attribution a {

    color:
        #00aaff !important;

}


/* =========================================================
   SMALL BLUE ARROW VEHICLE MARKER
========================================================= */

.vehicle-arrow {

    width: 0;

    height: 0;

    border-left:
        7px solid transparent;

    border-right:
        7px solid transparent;

    border-bottom:
        15px solid #00aaff;

    filter:
        drop-shadow(
            0 1px 2px
            rgba(
                0,
                0,
                0,
                0.9
            )
        );

}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

.fullscreen-button {

    position: fixed;

    top:
        calc(
            env(safe-area-inset-top) + 6px
        );

    right:
        calc(
            env(safe-area-inset-right) + 6px
        );

    z-index: 99999;

    background: #050505;

    color: #00aaff;

    border:
        1px solid
        #00aaff;

    padding:
        6px 10px;

    font-size: 10px;

    font-weight: bold;

    border-radius: 3px;

}


.fullscreen-button:active {

    background: #00aaff;

    color: #000;

}


/* =========================================================
   ROTATE SCREEN
========================================================= */

.rotate-overlay {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 999999;

    background: #050505;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    text-align: center;

}


.rotate-title {

    font-size: 22px;

    font-weight: 900;

    color: #ffffff;

}


.rotate-text {

    margin-top: 10px;

    color: #777;

    font-size: 14px;

}


/* =========================================================
   MOBILE LANDSCAPE
========================================================= */

@media
(max-width: 1100px)
and
(orientation: landscape) {

    .driver-dashboard {

        width: 100vw;

        height: 100dvh;

        grid-template-columns:
            10%
            55%
            35%;

        grid-template-rows:
            14%
            54%
            14%
            18%;

        gap: 2px;

        padding: 2px;

    }


    .team-title {

        font-size:
            clamp(
                14px,
                4vw,
                30px
            );

    }


    .team-logo {

        width: 24px;
        height: 24px;

    }


    .speed-value {

        font-size:
            clamp(
                38px,
                10vh,
                75px
            );

    }


    .card-value {

        font-size:
            clamp(
                16px,
                4vw,
                30px
            );

    }


    .fuel-power {

        font-size:
            clamp(
                16px,
                4vw,
                30px
            );

    }


    .motor-temp,
    .fuel-temp {

        font-size:
            clamp(
                10px,
                2vw,
                18px
            );

    }


    .message-panel {

        border-left-width: 3px;

    }


    .system-message {

        font-size:
            clamp(
                9px,
                2.5vw,
                18px
            );

    }


    .slope-section {

        height: 7%;

        min-height: 25px;

        gap: 5px;

    }


    .section-label {

        font-size: 6px;

    }


    .slope-value {

        font-size: 18px;

    }


    .data-unit {

        font-size: 6px;

    }

}


/* =========================================================
   PORTRAIT
========================================================= */

@media
(max-width: 1100px)
and
(orientation: portrait) {

    .rotate-overlay {

        display: flex;

    }


    .driver-dashboard {

        display: none;

    }


    .fullscreen-button {

        display: none;

    }

}


/* =========================================================
   FULLSCREEN
========================================================= */

:fullscreen {

    background: #050505;

}


:fullscreen .fullscreen-button {

    display: none;

}


/* =========================================================
   VERY SMALL LANDSCAPE
========================================================= */

@media
(max-width: 700px)
and
(orientation: landscape) {

    .connection {

        font-size: 7px;

    }


    .section-label {

        font-size: 6px;

    }


    .slope-value {

        font-size: 16px;

    }


    .data-unit {

        font-size: 5px;

    }


    .speed-value {

        font-size: 42px;

    }


    .speed-label {

        font-size: 7px;

    }


    .speed-unit {

        font-size: 7px;

    }


    .card-title {

        font-size: 6px;

    }


    .card-value {

        font-size: 18px;

    }


    .sub-label {

        font-size: 5px;

    }


    .motor-temp,
    .fuel-temp {

        font-size: 10px;

    }


    .telemetry-label {

        font-size: 5px;

    }


    .telemetry-value {

        font-size: 14px;

    }


    .telemetry-unit {

        font-size: 5px;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     ROTATE OVERLAY
========================================================= -->

<div
    class="rotate-overlay"
    id="rotateOverlay"
>

    <div class="rotate-title">
        ROTATE DEVICE
    </div>

    <div class="rotate-text">
        Turn your phone to landscape mode
    </div>

</div>


<!-- =========================================================
     FULLSCREEN
========================================================= -->

<button
    id="fullscreenButton"
    class="fullscreen-button"
>

    FULL SCREEN

</button>


<!-- =========================================================
     MAIN DASHBOARD
========================================================= -->

<div class="driver-dashboard">


    <!-- =====================================================
         CONNECTION
    ===================================================== -->

    <div class="panel status-panel">

        <div
            class="connection disconnected"
            id="connectionStatus"
        >

            <span
                class="connection-dot"
            ></span>

            <span id="connectionText">
                NO DATA
            </span>

        </div>

    </div>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <div class="panel title-panel">

        <div class="title-content">

            <img
                src="/logo.png"
                class="team-logo"
                alt="Team ReNew"
                onerror="
                    this.style.display='none'
                "
            >

            <div class="team-title">

                TEAM
                <span>ReNew</span>

            </div>

        </div>

    </div>


    <!-- =====================================================
         RIGHT SIDE
         MAP + SLOPE BOTTOM
    ===================================================== -->

    <div class="panel slope-panel">


        <!-- =================================================
             MAP
        ================================================= -->

        <div class="map-container">

            <div class="map-header">

                <div class="map-title">
                    LIVE MAP
                </div>

            </div>


            <div id="map"></div>

        </div>


        <!-- =================================================
             SLOPE
        ================================================= -->

        <div class="slope-section">

            <div class="section-label">
                SLOPE
            </div>

            <div
                class="slope-value"
                id="slope"
            >
                --
            </div>

            <div class="data-unit">
                DEG
            </div>

        </div>

    </div>


    <!-- =====================================================
         THROTTLE
    ===================================================== -->

    <div class="panel throttle-panel">

        <div class="throttle-title">
            THROTTLE %
        </div>


        <div class="throttle-bar">

            <div
                class="throttle-fill"
                id="throttleFill"
            ></div>


            <div
                class="throttle-value"
                id="throttleValue"
            >
                0%
            </div>

        </div>


        <div class="throttle-label-bottom">
            0 — 100
        </div>

    </div>


    <!-- =====================================================
         CENTER
    ===================================================== -->

    <div class="center-area">


        <!-- =================================================
             TOP CARDS
        ================================================= -->

        <div class="top-cards">


            <!-- =================================================
                 MOTOR
            ================================================= -->

            <div class="panel motor-card">

                <div class="card-title">
                    MOTOR POWER
                </div>

                <div
                    class="card-value"
                    id="motorPower"
                >
                    0
                </div>

                <div class="card-unit">
                    W
                </div>


                <div class="sub-label">
                    MOTOR TEMPERATURE
                </div>

                <div
                    class="motor-temp"
                    id="motorTemperature"
                >
                    0.0 °C
                </div>

            </div>


            <!-- =================================================
                 SPEED
            ================================================= -->

            <div class="panel speed-card">

                <div class="speed-label">
                    SPEED
                </div>

                <div
                    class="speed-value"
                    id="speed"
                >
                    0
                </div>

                <div class="speed-unit">
                    KM/H
                </div>

            </div>


            <!-- =================================================
                 FUEL CELL
            ================================================= -->

            <div class="panel fuel-card">

                <div class="card-title">
                    FUEL CELL POWER
                </div>

                <div
                    class="fuel-power"
                    id="fuelPower"
                >
                    0
                </div>

                <div class="card-unit">
                    W
                </div>


                <div class="sub-label">
                    FUEL CELL TEMPERATURE
                </div>

                <div
                    class="fuel-temp"
                    id="fuelTemperature"
                >
                    0.0 °C
                </div>

            </div>

        </div>


        <!-- =================================================
             TELEMETRY
        ================================================= -->

        <div class="telemetry-row">


            <!-- DISTANCE -->

            <div class="panel telemetry-box">

                <div class="telemetry-label">
                    DISTANCE
                </div>

                <div
                    class="telemetry-value"
                    id="distance"
                >
                    0.0
                </div>

                <div class="telemetry-unit">
                    m
                </div>

            </div>


            <!-- ACCELERATION -->

            <div class="panel telemetry-box">

                <div class="telemetry-label">
                    ACCELERATION
                </div>

                <div
                    class="telemetry-value"
                    id="acceleration"
                >
                    0.00
                </div>

                <div class="telemetry-unit">
                    m/s²
                </div>

            </div>


            <!-- DECELERATION -->

            <div class="panel telemetry-box">

                <div class="telemetry-label">
                    DECELERATION
                </div>

                <div
                    class="telemetry-value"
                    id="deceleration"
                >
                    0.00
                </div>

                <div class="telemetry-unit">
                    m/s²
                </div>

            </div>

        </div>


        <!-- =================================================
             SYSTEM MESSAGE
        ================================================= -->

        <div
            class="panel message-panel"
            id="systemPanel"
        >

            <div
                class="system-message"
                id="systemMessage"
            >
                SYSTEM NORMAL
            </div>

        </div>

    </div>


</div>


<script>

/* =========================================================
   SOCKET.IO
========================================================= */

const socket = io();


/* =========================================================
   DOM ELEMENTS
========================================================= */

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );

const connectionText =
    document.getElementById(
        "connectionText"
    );

const speedElement =
    document.getElementById(
        "speed"
    );

const throttleFill =
    document.getElementById(
        "throttleFill"
    );

const throttleValue =
    document.getElementById(
        "throttleValue"
    );

const motorPowerElement =
    document.getElementById(
        "motorPower"
    );

const fuelPowerElement =
    document.getElementById(
        "fuelPower"
    );

const motorTemperatureElement =
    document.getElementById(
        "motorTemperature"
    );

const fuelTemperatureElement =
    document.getElementById(
        "fuelTemperature"
    );

const accelerationElement =
    document.getElementById(
        "acceleration"
    );

const decelerationElement =
    document.getElementById(
        "deceleration"
    );

const distanceElement =
    document.getElementById(
        "distance"
    );

const slopeElement =
    document.getElementById(
        "slope"
    );

const systemPanel =
    document.getElementById(
        "systemPanel"
    );

const systemMessage =
    document.getElementById(
        "systemMessage"
    );

const fullscreenButton =
    document.getElementById(
        "fullscreenButton"
    );


/* =========================================================
   CONNECTION
========================================================= */

let lastTelemetryTime = 0;

const TELEMETRY_TIMEOUT = 3000;


function setConnected() {

    connectionStatus.classList.remove(
        "disconnected"
    );

    connectionStatus.classList.add(
        "connected"
    );

    connectionText.textContent =
        "CONNECTED";

}


function setDisconnected(
    text
) {

    connectionStatus.classList.remove(
        "connected"
    );

    connectionStatus.classList.add(
        "disconnected"
    );

    connectionText.textContent =
        text;

}


/* =========================================================
   SOCKET CONNECT
========================================================= */

socket.on(
    "connect",
    () => {

        console.log(
            "Driver dashboard connected"
        );

        console.log(
            "Socket ID:",
            socket.id
        );

    }
);


/* =========================================================
   SOCKET DISCONNECT
========================================================= */

socket.on(
    "disconnect",
    () => {

        console.log(
            "Driver dashboard disconnected"
        );

        setDisconnected(
            "DISCONNECTED"
        );

    }
);


/* =========================================================
   TELEMETRY TIMEOUT
========================================================= */

setInterval(
    () => {

        if (
            lastTelemetryTime !== 0
            &&
            Date.now()
            -
            lastTelemetryTime
            <=
            TELEMETRY_TIMEOUT
        ) {

            setConnected();

        }

        else if (
            lastTelemetryTime !== 0
        ) {

            setDisconnected(
                "NO DATA"
            );

        }

    },
    500
);


/* =========================================================
   NUMBER FORMAT
========================================================= */

function numberValue(
    value,
    decimals = 2
) {

    const n =
        Number(value);


    if (
        Number.isFinite(n)
    ) {

        return n.toFixed(
            decimals
        );

    }


    return "--";

}


/* =========================================================
   TELEMETRY
========================================================= */

socket.on(
    "telemetry",
    (data) => {

        /* ==================================================
           TELEMETRY SYNCHRONIZATION
        ================================================== */

        lastTelemetryTime =
            Date.now();

        setConnected();


        /*
         * These two values are generated by SERVER.JS.
         *
         * They identify the exact same packet that is
         * simultaneously sent to Team Dashboard,
         * Driver Dashboard and InfluxDB.
         */

        const telemetryId =
            data.telemetry_id;

        const serverTimestamp =
            data.server_timestamp;


        console.log(
            "Driver telemetry packet:",
            telemetryId
        );


        console.log(
            "Driver server timestamp:",
            serverTimestamp
        );


        /* ==================================================
           SPEED
        ================================================== */

        if (
            data.speed_kmh !== undefined
        ) {

            speedElement.textContent =
                numberValue(
                    data.speed_kmh,
                    1
                );

        }


        /* ==================================================
           THROTTLE
        ================================================== */

        if (
            data.throttle !== undefined
        ) {

            let throttle =
                Number(
                    data.throttle
                );


            if (
                !Number.isFinite(
                    throttle
                )
            ) {

                throttle = 0;

            }


            throttle =
                Math.max(
                    0,
                    Math.min(
                        100,
                        throttle
                    )
                );


            throttleFill.style.height =
                throttle
                +
                "%";


            throttleValue.textContent =
                throttle.toFixed(1)
                +
                "%";

        }


        /* ==================================================
           MOTOR POWER
        ================================================== */

        if (
            data.m_power !== undefined
        ) {

            motorPowerElement.textContent =
                numberValue(
                    data.m_power,
                    0
                );

        }


        /* ==================================================
           MOTOR TEMPERATURE
           
           IMPORTANT:
           SAME FIELD USED BY TEAM DASHBOARD
           
           DO NOT use:
               motor_temp
               motor_temperature
           
           Use only:
               ds18b20_temp
        ================================================== */

        if (
            data.ds18b20_temp !== undefined
        ) {

            motorTemperatureElement.textContent =
                numberValue(
                    data.ds18b20_temp,
                    1
                )
                +
                " °C";

        }


        /* ==================================================
           FUEL CELL POWER
        ================================================== */

        if (
            data.fc
            &&
            data.fc.power !== undefined
        ) {

            fuelPowerElement.textContent =
                numberValue(
                    data.fc.power,
                    0
                );

        }


        /* ==================================================
           FUEL CELL TEMPERATURE
        ================================================== */

        if (
            data.fc
            &&
            data.fc.stack_temp !== undefined
        ) {

            fuelTemperatureElement.textContent =
                numberValue(
                    data.fc.stack_temp,
                    1
                )
                +
                " °C";

        }


        /* ==================================================
           ACCELERATION
        ================================================== */

        if (
            data.accel !== undefined
        ) {

            accelerationElement.textContent =
                numberValue(
                    data.accel,
                    2
                );

        }


        /* ==================================================
           DECELERATION
        ================================================== */

        if (
            data.decel !== undefined
        ) {

            decelerationElement.textContent =
                numberValue(
                    data.decel,
                    2
                );

        }


        /* ==================================================
           DISTANCE
        ================================================== */

        if (
            data.distance_m !== undefined
        ) {

            distanceElement.textContent =
                numberValue(
                    data.distance_m,
                    1
                );

        }


        /* ==================================================
           SLOPE
        ================================================== */

        if (
            data.slope !== undefined
        ) {

            slopeElement.textContent =
                numberValue(
                    data.slope,
                    1
                )
                +
                "°";

        }


        /* ==================================================
           SYSTEM STATUS
        ================================================== */

        updateSystemStatus(
            data
        );


        /* ==================================================
           GPS
        ================================================== */

        if (
            data.gps
            &&
            data.gps.lat !== undefined
            &&
            data.gps.lon !== undefined
        ) {

            updateVehiclePosition(

                Number(
                    data.gps.lat
                ),

                Number(
                    data.gps.lon
                )

            );

        }

    }
);


/* =========================================================
   SYSTEM STATUS
========================================================= */

function updateSystemStatus(
    data
) {

    let warning = false;

    let message =
        "SYSTEM NORMAL";


    /* =====================================================
       FUEL CELL ERROR
    ===================================================== */

    if (
        data.fc
        &&
        data.fc.error_flag !== undefined
        &&
        Number(
            data.fc.error_flag
        ) !== 0
    ) {

        warning = true;

        message =
            "FUEL CELL ERROR";

    }


    /* =====================================================
       HYDROGEN LEAK
    ===================================================== */

    if (
        data.fc
        &&
        data.fc.h2_leak_volts !== undefined
    ) {

        const leak =
            Number(
                data.fc.h2_leak_volts
            );


        if (
            Number.isFinite(
                leak
            )
            &&
            leak >= 2.5
        ) {

            warning = true;

            message =
                "HYDROGEN LEAK WARNING";

        }

    }


    /* =====================================================
       HIGH TEMPERATURE

       SAME MOTOR TEMPERATURE FIELD:
       ds18b20_temp
    ===================================================== */

    if (
        data.ds18b20_temp !== undefined
    ) {

        const temperature =
            Number(
                data.ds18b20_temp
            );


        if (
            Number.isFinite(
                temperature
            )
            &&
            temperature >= 70
        ) {

            warning = true;

            message =
                "HIGH TEMPERATURE";

        }

    }


    /* =====================================================
       UPDATE SYSTEM
    ===================================================== */

    systemMessage.textContent =
        message;


    if (
        warning
    ) {

        systemPanel.classList.add(
            "warning"
        );

    }

    else {

        systemPanel.classList.remove(
            "warning"
        );

    }

}


/* =========================================================
   MAP DEFAULT LOCATION
========================================================= */

const defaultLat =
    11.0789;


const defaultLon =
    76.9860;


/* =========================================================
   CREATE MAP
========================================================= */

const map =
    L.map(
        "map",
        {

            zoomControl: true,

            scrollWheelZoom: true,

            doubleClickZoom: true,

            dragging: true,

            touchZoom: true,

            keyboard: true

        }
    ).setView(

        [
            defaultLat,
            defaultLon
        ],

        18

    );


/* =========================================================
   OPEN STREET MAP
========================================================= */

L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom: 21,

        minZoom: 1,

        attribution:
            "&copy; OpenStreetMap contributors"

    }

).addTo(
    map
);


/* =========================================================
   SMALL BLUE ARROW
========================================================= */

const vehicleArrowIcon =
    L.divIcon({

        className:
            "vehicle-arrow-wrapper",

        html:
            '<div class="vehicle-arrow"></div>',

        iconSize:
            [
                14,
                15
            ],

        iconAnchor:
            [
                7,
                8
            ]

    });


/* =========================================================
   CREATE VEHICLE MARKER
========================================================= */

const marker =
    L.marker(

        [
            defaultLat,
            defaultLon
        ],

        {

            icon:
                vehicleArrowIcon,

            zIndexOffset:
                1000

        }

    ).addTo(
        map
    );


/* =========================================================
   LAST VEHICLE POSITION
========================================================= */

let lastVehiclePoint =
    null;


/* =========================================================
   GPS UPDATE
========================================================= */

function updateVehiclePosition(

    latitude,
    longitude

) {

    /* =====================================================
       VALIDATE GPS
    ===================================================== */

    if (

        !Number.isFinite(
            latitude
        )

        ||

        !Number.isFinite(
            longitude
        )

        ||

        latitude < -90

        ||

        latitude > 90

        ||

        longitude < -180

        ||

        longitude > 180

    ) {

        console.warn(
            "Invalid GPS:",
            latitude,
            longitude
        );

        return;

    }


    /* =====================================================
       CURRENT POINT
    ===================================================== */

    const currentPoint = [

        latitude,
        longitude

    ];


    /* =====================================================
       MOVE ARROW
    ===================================================== */

    marker.setLatLng(
        currentPoint
    );


    /* =====================================================
       SAVE POSITION
    ===================================================== */

    lastVehiclePoint =
        currentPoint;


    /* =====================================================
       FOLLOW VEHICLE
    ===================================================== */

    map.panTo(

        currentPoint,

        {

            animate: true,

            duration: 0.4

        }

    );

}


/* =========================================================
   MAP RESIZE
========================================================= */

function resizeMap() {

    setTimeout(

        () => {

            map.invalidateSize(
                true
            );

        },

        150

    );

}


window.addEventListener(

    "resize",

    resizeMap

);


window.addEventListener(

    "orientationchange",

    () => {

        setTimeout(

            resizeMap,

            500

        );

    }

);


if (
    screen.orientation
) {

    screen.orientation.addEventListener(

        "change",

        () => {

            setTimeout(

                resizeMap,

                400

            );

        }

    );

}


setTimeout(

    resizeMap,

    500

);


/* =========================================================
   FULLSCREEN
========================================================= */

async function enterFullscreen() {

    try {

        /* =================================================
           FULLSCREEN
        ================================================= */

        if (
            !document.fullscreenElement
        ) {

            await document
                .documentElement
                .requestFullscreen();

        }


        /* =================================================
           LANDSCAPE
        ================================================= */

        if (
            screen.orientation
            &&
            screen.orientation.lock
        ) {

            try {

                await screen.orientation.lock(
                    "landscape"
                );

            }

            catch (
                error
            ) {

                console.log(
                    "Orientation lock unavailable"
                );

            }

        }


        /* =================================================
           WAKE LOCK
        ================================================= */

        if (
            "wakeLock"
            in
            navigator
        ) {

            try {

                await navigator.wakeLock.request(
                    "screen"
                );

            }

            catch (
                error
            ) {

                console.log(
                    "Wake lock unavailable"
                );

            }

        }


        fullscreenButton.style.display =
            "none";


        setTimeout(

            resizeMap,

            500

        );

    }

    catch (
        error
    ) {

        console.warn(
            "Fullscreen unavailable:",
            error
        );

    }

}


fullscreenButton.addEventListener(

    "click",

    enterFullscreen

);


/* =========================================================
   FULLSCREEN CHANGE
========================================================= */

document.addEventListener(

    "fullscreenchange",

    () => {

        if (
            document.fullscreenElement
        ) {

            fullscreenButton.style.display =
                "none";

        }

        else {

            fullscreenButton.style.display =
                "block";

        }


        setTimeout(

            resizeMap,

            400

        );

    }

);


/* =========================================================
   SERVICE WORKER
========================================================= */

if (
    "serviceWorker"
    in
    navigator
) {

    window.addEventListener(

        "load",

        () => {

            navigator.serviceWorker
                .register(
                    "/sw.js"
                )

                .then(

                    registration => {

                        console.log(
                            "Service Worker:",
                            registration.scope
                        );

                    }

                )

                .catch(

                    error => {

                        console.warn(
                            "Service Worker failed:",
                            error
                        );

                    }

                );

        }

    );

}

</script>


</body>

</html>
