<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
>

<title>Team ReNew - Driver Dashboard</title>


<!-- =========================================================
     SOCKET.IO
========================================================= -->

<script src="/socket.io/socket.io.js"></script>


<!-- =========================================================
     LEAFLET
========================================================= -->

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

    -webkit-tap-highlight-color: transparent;

}


html,
body {

    width: 100%;
    height: 100%;

    background: #050505;

    color: #ffffff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


body {

    overflow: hidden;

}


/* =========================================================
   COMMON PANEL
========================================================= */

.panel {

    background: #0b0b0b;

    border:
        1px solid
        #252525;

    position: relative;

    overflow: hidden;

}


/* =========================================================
   MAIN DASHBOARD

   PHYSICAL DISPLAY TARGET:

   15 cm × 6 cm

   Aspect ratio:

   15 / 6 = 2.5

========================================================= */

.driver-dashboard {

    width: min(
        100vw,
        calc(100vh * 2.5)
    );

    height: min(
        100vh,
        calc(100vw / 2.5)
    );

    aspect-ratio: 15 / 6;

    margin: auto;

    padding: 4px;

    display: grid;

    /*
       15:6 dashboard

       Left       = 10%
       Center     = 60%
       Right      = 30%
    */

    grid-template-columns:
        10%
        60%
        30%;

    /*
       Header
       Main
       Bottom data
       System
    */

    grid-template-rows:
        13%
        62%
        13%
        12%;

    gap: 4px;

    background: #050505;

}


/* =========================================================
   BODY CENTERING
========================================================= */

body {

    display: flex;

    align-items: center;

    justify-content: center;

}


/* =========================================================
   CONNECTION
========================================================= */

.status-panel {

    grid-column: 1;

    grid-row: 1;

    display: flex;

    align-items: center;

    justify-content: center;

}


.connection {

    font-size:
        clamp(
            7px,
            1.2vw,
            15px
        );

    font-weight: bold;

    letter-spacing: 1px;

    display: flex;

    align-items: center;

    gap: 6px;

    white-space: nowrap;

}


.connection-dot {

    width:
        clamp(
            6px,
            0.7vw,
            11px
        );

    height:
        clamp(
            6px,
            0.7vw,
            11px
        );

    border-radius: 50%;

    background: #ff3030;

    box-shadow:
        0 0 10px #ff3030;

    flex-shrink: 0;

}


.connection.connected {

    color: #00ff9d;

}


.connection.connected
.connection-dot {

    background: #00ff9d;

    box-shadow:
        0 0 12px #00ff9d;

}


.connection.disconnected {

    color: #ff3030;

}


/* =========================================================
   TITLE
========================================================= */

.title-panel {

    grid-column: 2;

    grid-row: 1;

    display: flex;

    align-items: center;

    justify-content: center;

    border-bottom:
        3px solid
        #00aaff;

}


.title-content {

    width: 100%;

    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    gap:
        clamp(
            5px,
            1vw,
            18px
        );

}


.team-logo {

    width:
        clamp(
            25px,
            5vw,
            58px
        );

    height:
        clamp(
            25px,
            5vw,
            58px
        );

    object-fit: contain;

}


.team-title {

    font-size:
        clamp(
            17px,
            3vw,
            46px
        );

    font-weight: 900;

    letter-spacing:
        clamp(
            2px,
            0.4vw,
            5px
        );

    color: #ffffff;

    text-transform: uppercase;

    white-space: nowrap;

}


.team-title span {

    color: #00aaff;

}


/* =========================================================
   SLOPE
========================================================= */

.slope-panel {

    grid-column: 3;

    grid-row: 1;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

}


.section-label {

    font-size:
        clamp(
            7px,
            1vw,
            13px
        );

    color: #777;

    letter-spacing:
        clamp(
            1px,
            0.3vw,
            3px
        );

    text-transform: uppercase;

}


.slope-value {

    margin-top: 2px;

    font-size:
        clamp(
            18px,
            2.5vw,
            32px
        );

    font-weight: 900;

    color: #00aaff;

}


.slope-panel .data-unit {

    font-size:
        clamp(
            6px,
            0.8vw,
            10px
        );

}


/* =========================================================
   THROTTLE
========================================================= */

.throttle-panel {

    grid-column: 1;

    grid-row: 2;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 4px;

}


.vertical-label {

    display: none;

}


.throttle-bar {

    position: relative;

    width:
        clamp(
            30px,
            4vw,
            78px
        );

    height: 75%;

    min-height: 0;

    max-height: none;

    border:
        2px solid
        #333;

    background: #111;

    display: flex;

    align-items: flex-end;

    overflow: hidden;

}


.throttle-fill {

    width: 100%;

    height: 0%;

    background:
        linear-gradient(
            to top,
            #00aaff,
            #00d9ff
        );

    box-shadow:
        0 0 20px
        rgba(
            0,
            170,
            255,
            0.7
        );

    transition:
        height 0.15s linear;

}


.throttle-value {

    position: absolute;

    bottom:
        clamp(
            5px,
            1vh,
            18px
        );

    left: 0;

    width: 100%;

    text-align: center;

    font-size:
        clamp(
            10px,
            1.6vw,
            22px
        );

    font-weight: 900;

    color: #ffffff;

    text-shadow:
        0 0 8px #000;

}


.throttle-title {

    margin-top: 5px;

    color: #777;

    font-size:
        clamp(
            6px,
            0.8vw,
            11px
        );

    letter-spacing:
        clamp(
            0px,
            0.15vw,
            2px
        );

}


/* =========================================================
   CENTER AREA

   SPEED
   +
   POWER

========================================================= */

.main-center {

    grid-column: 2;

    grid-row: 2;

    display: grid;

    grid-template-rows:
        65%
        35%;

    gap: 4px;

    background: #050505;

    min-width: 0;

    min-height: 0;

    overflow: hidden;

}


/* =========================================================
   SPEED
========================================================= */

.speed-panel {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    border-top:
        3px solid
        #00aaff;

    min-height: 0;

}


.speed-label {

    color: #777;

    font-size:
        clamp(
            8px,
            1.3vw,
            16px
        );

    letter-spacing:
        clamp(
            3px,
            0.6vw,
            8px
        );

    margin-bottom: 3px;

}


.speed-value {

    font-size:
        clamp(
            48px,
            10vw,
            180px
        );

    line-height: 0.8;

    font-weight: 900;

    color: #ffffff;

    text-shadow:
        0 0 18px
        rgba(
            255,
            255,
            255,
            0.2
        );

}


.speed-unit {

    margin-top: 5px;

    color: #00aaff;

    font-size:
        clamp(
            8px,
            1.4vw,
            18px
        );

    font-weight: bold;

    letter-spacing:
        clamp(
            2px,
            0.3vw,
            4px
        );

}


/* =========================================================
   POWER ROW
========================================================= */

.power-row {

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 4px;

    min-width: 0;

    min-height: 0;

}


.power-panel {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    min-width: 0;

    min-height: 0;

    padding: 2px;

}


.power-label {

    color: #777;

    font-size:
        clamp(
            6px,
            1vw,
            14px
        );

    letter-spacing:
        clamp(
            0px,
            0.15vw,
            2px
        );

    text-align: center;

    white-space: nowrap;

}


.fuel-power {

    margin-top: 3px;

    font-size:
        clamp(
            18px,
            3.5vw,
            60px
        );

    line-height: 1;

    font-weight: 900;

    color: #00ff9d;

}


.motor-power {

    margin-top: 3px;

    font-size:
        clamp(
            18px,
            3.5vw,
            60px
        );

    line-height: 1;

    font-weight: 900;

    color: #00aaff;

}


.power-unit {

    color: #888;

    font-size:
        clamp(
            6px,
            0.8vw,
            12px
        );

}


/* =========================================================
   MAP
========================================================= */

.map-panel {

    grid-column: 3;

    grid-row: 2;

    display: flex;

    flex-direction: column;

    min-width: 0;

    min-height: 0;

}


.map-header {

    height:
        clamp(
            22px,
            3.5vh,
            48px
        );

    min-height:
        clamp(
            22px,
            3.5vh,
            48px
        );

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0
        clamp(
            5px,
            0.8vw,
            12px
        );

    border-bottom:
        1px solid
        #252525;

}


.map-title {

    color: #00aaff;

    font-size:
        clamp(
            8px,
            1.3vw,
            17px
        );

    font-weight: bold;

    letter-spacing:
        clamp(
            1px,
            0.2vw,
            2px
        );

}


.clear-button {

    background: #050505;

    color: #00aaff;

    border:
        1px solid
        #00aaff;

    padding:
        clamp(
            2px,
            0.4vw,
            7px
        )
        clamp(
            5px,
            0.8vw,
            15px
        );

    font-size:
        clamp(
            6px,
            0.8vw,
            12px
        );

    font-weight: bold;

    cursor: pointer;

}


.clear-button:hover {

    background: #00aaff;

    color: #000;

}


#map {

    flex: 1;

    min-height: 0;

    width: 100%;

}


/* =========================================================
   ROUTE STATUS
========================================================= */

.route-status {

    position: absolute;

    bottom: 5px;

    left: 5px;

    z-index: 1000;

    background:
        rgba(
            0,
            0,
            0,
            0.75
        );

    padding:
        3px 6px;

    font-size:
        clamp(
            6px,
            0.7vw,
            11px
        );

    color: #ffffff;

    border:
        1px solid
        #333;

}


/* =========================================================
   BOTTOM TELEMETRY
========================================================= */

.bottom-data {

    grid-column: 1 / 4;

    grid-row: 3;

    display: grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap: 4px;

    background: #050505;

    min-width: 0;

    min-height: 0;

}


.data-box {

    display: flex;

    align-items: center;

    justify-content: center;

    gap:
        clamp(
            3px,
            0.5vw,
            10px
        );

    min-width: 0;

    min-height: 0;

    padding: 2px;

}


.data-label {

    color: #777;

    font-size:
        clamp(
            6px,
            1vw,
            13px
        );

    letter-spacing:
        clamp(
            0px,
            0.1vw,
            1px
        );

}


.data-value {

    font-size:
        clamp(
            11px,
            2vw,
            24px
        );

    font-weight: 900;

    color: #ffffff;

}


.data-unit {

    color: #888;

    font-size:
        clamp(
            6px,
            0.7vw,
            11px
        );

}


/* =========================================================
   SYSTEM STATUS
========================================================= */

.system-panel {

    grid-column: 1 / 4;

    grid-row: 4;

    display: flex;

    align-items: center;

    justify-content: center;

    border-left:
        4px solid
        #00ff9d;

    min-height: 0;

}


.system-message {

    color: #00ff9d;

    font-size:
        clamp(
            12px,
            2.5vw,
            40px
        );

    font-weight: 900;

    letter-spacing:
        clamp(
            1px,
            0.3vw,
            4px
        );

    text-transform: uppercase;

    white-space: nowrap;

}


.system-panel.warning {

    border-left-color:
        #ff3030;

}


.system-panel.warning
.system-message {

    color: #ff3030;

    animation:
        warningBlink
        0.8s
        infinite
        alternate;

}


@keyframes warningBlink {

    from {

        opacity: 1;

    }

    to {

        opacity: 0.45;

    }

}


/* =========================================================
   LEAFLET
========================================================= */

.leaflet-control-zoom a {

    background:
        #111 !important;

    color:
        #ffffff !important;

    border-color:
        #333 !important;

}


.leaflet-control-attribution {

    background:
        rgba(
            0,
            0,
            0,
            0.65
        ) !important;

    color:
        #ffffff !important;

}


.leaflet-control-attribution a {

    color:
        #00aaff !important;

}


/* =========================================================
   ROTATE OVERLAY
========================================================= */

.rotate-overlay {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 99999;

    background: #050505;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    text-align: center;

    padding: 30px;

}


.rotate-icon {

    font-size: 60px;

    margin-bottom: 20px;

    animation:
        rotatePhone
        1.5s
        infinite
        ease-in-out;

}


.rotate-title {

    color: #ffffff;

    font-size: 22px;

    font-weight: 900;

    letter-spacing: 2px;

}


.rotate-text {

    color: #777;

    font-size: 14px;

    margin-top: 10px;

}


@keyframes rotatePhone {

    0% {

        transform:
            rotate(0deg);

    }

    40% {

        transform:
            rotate(90deg);

    }

    70% {

        transform:
            rotate(90deg);

    }

    100% {

        transform:
            rotate(0deg);

    }

}


/* =========================================================
   MOBILE LANDSCAPE
========================================================= */

@media
(max-width: 1100px)
and
(orientation: landscape) {

    html,
    body {

        width: 100vw;

        height: 100dvh;

        overflow: hidden;

    }


    body {

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 0;

        margin: 0;

    }


    .driver-dashboard {

        width:
            min(
                100vw,
                calc(100dvh * 2.5)
            );

        height:
            min(
                100dvh,
                calc(100vw / 2.5)
            );

        aspect-ratio:
            15 / 6;

        padding: 3px;

        gap: 3px;

        margin: 0;

    }


    .connection {

        font-size:
            clamp(
                7px,
                1.6vw,
                12px
            );

        gap: 3px;

    }


    .team-title {

        font-size:
            clamp(
                16px,
                4vw,
                30px
            );

    }


    .team-logo {

        width:
            clamp(
                22px,
                5vh,
                36px
            );

        height:
            clamp(
                22px,
                5vh,
                36px
            );

    }


    .slope-value {

        font-size:
            clamp(
                16px,
                4vw,
                28px
            );

    }


    .throttle-bar {

        width:
            clamp(
                28px,
                5vw,
                48px
            );

        height: 72%;

    }


    .speed-value {

        font-size:
            clamp(
                50px,
                17vh,
                110px
            );

    }


    .fuel-power,
    .motor-power {

        font-size:
            clamp(
                18px,
                6vw,
                40px
            );

    }


    .map-header {

        height: 24px;

        min-height: 24px;

    }


    .bottom-data {

        gap: 3px;

    }


    .system-message {

        font-size:
            clamp(
                11px,
                3vw,
                22px
            );

    }

}


/* =========================================================
   VERY SHORT LANDSCAPE
========================================================= */

@media
(max-width: 1100px)
and
(orientation: landscape)
and
(max-height: 430px) {

    .driver-dashboard {

        padding: 2px;

        gap: 2px;

    }


    .speed-value {

        font-size:
            clamp(
                45px,
                17vh,
                90px
            );

    }


    .speed-label {

        font-size: 8px;

        letter-spacing: 3px;

    }


    .speed-unit {

        font-size: 9px;

    }


    .fuel-power,
    .motor-power {

        font-size:
            clamp(
                16px,
                6vw,
                30px
            );

    }


    .power-label {

        font-size: 6px;

    }


    .map-header {

        height: 20px;

        min-height: 20px;

    }


    .map-title {

        font-size: 8px;

    }


    .clear-button {

        padding:
            1px 5px;

        font-size: 6px;

    }


    .system-message {

        font-size: 10px;

    }

}


/* =========================================================
   PORTRAIT PHONE
========================================================= */

@media
(max-width: 1100px)
and
(orientation: portrait) {

    .rotate-overlay {

        display: flex;

    }


    .driver-dashboard {

        display: none;

    }

}


/* =========================================================
   DESKTOP
========================================================= */

@media
(min-width: 1101px) {

    .rotate-overlay {

        display: none;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     ROTATE MESSAGE
========================================================= -->

<div
    class="rotate-overlay"
    id="rotateOverlay"
>

    <div class="rotate-icon">
        📱
    </div>

    <div class="rotate-title">
        ROTATE DEVICE
    </div>

    <div class="rotate-text">
        Turn your phone to landscape mode
        for the Driver Dashboard
    </div>

</div>


<!-- =========================================================
     DRIVER DASHBOARD
========================================================= -->

<div class="driver-dashboard">


    <!-- =====================================================
         CONNECTION
    ===================================================== -->

    <div class="panel status-panel">

        <div
            class="connection disconnected"
            id="connectionStatus"
        >

            <span
                class="connection-dot"
            ></span>

            <span
                id="connectionText"
            >
                NO DATA
            </span>

        </div>

    </div>


    <!-- =====================================================
         TEAM TITLE
    ===================================================== -->

    <div class="panel title-panel">

        <div class="title-content">

            <img
                src="/logo.png"
                class="team-logo"
                alt="Team ReNew"
                onerror="
                    this.style.display='none'
                "
            >

            <div class="team-title">

                TEAM
                <span>RENEW</span>

            </div>

        </div>

    </div>


    <!-- =====================================================
         SLOPE
    ===================================================== -->

    <div class="panel slope-panel">

        <div class="section-label">

            SLOPE

        </div>

        <div
            class="slope-value"
            id="slope"
        >

            --

        </div>

        <div class="data-unit">

            DEG

        </div>

    </div>


    <!-- =====================================================
         THROTTLE
    ===================================================== -->

    <div class="panel throttle-panel">

        <div class="vertical-label">

            THROTTLE

        </div>


        <div class="throttle-bar">

            <div
                class="throttle-fill"
                id="throttleFill"
            ></div>


            <div
                class="throttle-value"
                id="throttleValue"
            >

                0%

            </div>

        </div>


        <div class="throttle-title">

            THROTTLE %

        </div>

    </div>


    <!-- =====================================================
         CENTER

         SPEED
         +
         POWER
    ===================================================== -->

    <div class="main-center">


        <!-- =================================================
             SPEED
        ================================================= -->

        <div class="panel speed-panel">

            <div class="speed-label">

                SPEED

            </div>


            <div
                class="speed-value"
                id="speed"
            >

                0

            </div>


            <div class="speed-unit">

                KM/H

            </div>

        </div>


        <!-- =================================================
             POWER
        ================================================= -->

        <div class="power-row">


            <!-- FUEL CELL -->

            <div class="panel power-panel">

                <div class="power-label">

                    FUEL CELL POWER

                </div>


                <div
                    class="fuel-power"
                    id="fuelPower"
                >

                    0

                </div>


                <div class="power-unit">

                    W

                </div>

            </div>


            <!-- MOTOR -->

            <div class="panel power-panel">

                <div class="power-label">

                    MOTOR POWER

                </div>


                <div
                    class="motor-power"
                    id="motorPower"
                >

                    0

                </div>


                <div class="power-unit">

                    W

                </div>

            </div>


        </div>

    </div>


    <!-- =====================================================
         LIVE MAP
    ===================================================== -->

    <div class="panel map-panel">


        <div class="map-header">

            <div class="map-title">

                LIVE MAP

            </div>


            <button
                class="clear-button"
                id="clearRoute"
            >

                CLEAR

            </button>

        </div>


        <div id="map"></div>


        <div
            class="route-status"
            id="routeStatus"
        >

            Route: 0 points

        </div>

    </div>


    <!-- =====================================================
         BOTTOM DATA
    ===================================================== -->

    <div class="bottom-data">


        <!-- ACCELERATION -->

        <div class="panel data-box">

            <span class="data-label">

                ACCEL

            </span>

            <span
                class="data-value"
                id="acceleration"
            >

                0.00

            </span>

            <span class="data-unit">

                m/s²

            </span>

        </div>


        <!-- DISTANCE -->

        <div class="panel data-box">

            <span class="data-label">

                DIST

            </span>

            <span
                class="data-value"
                id="distance"
            >

                0.0

            </span>

            <span class="data-unit">

                m

            </span>

        </div>


        <!-- DECELERATION -->

        <div class="panel data-box">

            <span class="data-label">

                DECEL

            </span>

            <span
                class="data-value"
                id="deceleration"
            >

                0.00

            </span>

            <span class="data-unit">

                m/s²

            </span>

        </div>


        <!-- TEMPERATURE -->

        <div class="panel data-box">

            <span class="data-label">

                TEMP

            </span>

            <span
                class="data-value"
                id="temperature"
            >

                0.0

            </span>

            <span class="data-unit">

                °C

            </span>

        </div>

    </div>


    <!-- =====================================================
         SYSTEM STATUS
    ===================================================== -->

    <div
        class="panel system-panel"
        id="systemPanel"
    >

        <div
            class="system-message"
            id="systemMessage"
        >

            SYSTEM NORMAL

        </div>

    </div>


</div>


<script>

/* =========================================================
   SOCKET.IO
========================================================= */

const socket = io();


/* =========================================================
   DOM ELEMENTS
========================================================= */

const connectionStatus =
    document.getElementById(
        "connectionStatus"
    );


const connectionText =
    document.getElementById(
        "connectionText"
    );


const speedElement =
    document.getElementById(
        "speed"
    );


const throttleFill =
    document.getElementById(
        "throttleFill"
    );


const throttleValue =
    document.getElementById(
        "throttleValue"
    );


const fuelPowerElement =
    document.getElementById(
        "fuelPower"
    );


const motorPowerElement =
    document.getElementById(
        "motorPower"
    );


const accelerationElement =
    document.getElementById(
        "acceleration"
    );


const decelerationElement =
    document.getElementById(
        "deceleration"
    );


const temperatureElement =
    document.getElementById(
        "temperature"
    );


const distanceElement =
    document.getElementById(
        "distance"
    );


const slopeElement =
    document.getElementById(
        "slope"
    );


const systemPanel =
    document.getElementById(
        "systemPanel"
    );


const systemMessage =
    document.getElementById(
        "systemMessage"
    );


const routeStatus =
    document.getElementById(
        "routeStatus"
    );


const clearRouteButton =
    document.getElementById(
        "clearRoute"
    );


/* =========================================================
   TELEMETRY TIMEOUT
========================================================= */

let lastTelemetryTime = 0;

const TELEMETRY_TIMEOUT = 3000;


/* =========================================================
   CONNECTION STATUS
========================================================= */

function setConnected() {

    connectionStatus.classList.remove(
        "disconnected"
    );

    connectionStatus.classList.add(
        "connected"
    );

    connectionText.textContent =
        "CONNECTED";

}


function setDisconnected(
    text
) {

    connectionStatus.classList.remove(
        "connected"
    );

    connectionStatus.classList.add(
        "disconnected"
    );

    connectionText.textContent =
        text;

}


/* =========================================================
   SOCKET CONNECT
========================================================= */

socket.on(
    "connect",
    () => {

        console.log(
            "Driver dashboard connected"
        );

    }
);


/* =========================================================
   SOCKET DISCONNECT
========================================================= */

socket.on(
    "disconnect",
    () => {

        console.log(
            "Driver dashboard disconnected"
        );

        setDisconnected(
            "DISCONNECTED"
        );

    }
);


/* =========================================================
   TELEMETRY TIME CHECK
========================================================= */

setInterval(
    () => {

        if (
            lastTelemetryTime !== 0 &&
            Date.now() -
            lastTelemetryTime <=
            TELEMETRY_TIMEOUT
        ) {

            setConnected();

        }

        else if (
            lastTelemetryTime !== 0
        ) {

            setDisconnected(
                "NO DATA"
            );

        }

    },
    500
);


/* =========================================================
   NUMBER FORMAT
========================================================= */

function numberValue(
    value,
    decimals = 2
) {

    const n =
        Number(value);


    if (
        Number.isFinite(n)
    ) {

        return n.toFixed(
            decimals
        );

    }


    return "--";

}


/* =========================================================
   TELEMETRY
========================================================= */

socket.on(
    "telemetry",
    (data) => {

        console.log(
            "Driver telemetry:",
            data
        );


        /* ================================================
           TELEMETRY RECEIVED
        ================================================ */

        lastTelemetryTime =
            Date.now();

        setConnected();


        /* ================================================
           SPEED
        ================================================ */

        if (
            data.speed_kmh !== undefined
        ) {

            speedElement.textContent =
                numberValue(
                    data.speed_kmh,
                    1
                );

        }


        /* ================================================
           THROTTLE
        ================================================ */

        if (
            data.throttle !== undefined
        ) {

            let throttle =
                Number(
                    data.throttle
                );


            if (
                !Number.isFinite(
                    throttle
                )
            ) {

                throttle = 0;

            }


            throttle =
                Math.max(
                    0,
                    Math.min(
                        100,
                        throttle
                    )
                );


            throttleFill.style.height =
                throttle + "%";


            throttleValue.textContent =
                throttle.toFixed(1)
                +
                "%";

        }


        /* ================================================
           ACCELERATION
        ================================================ */

        if (
            data.accel !== undefined
        ) {

            accelerationElement.textContent =
                numberValue(
                    data.accel,
                    2
                );

        }


        /* ================================================
           DECELERATION
        ================================================ */

        if (
            data.decel !== undefined
        ) {

            decelerationElement.textContent =
                numberValue(
                    data.decel,
                    2
                );

        }


        /* ================================================
           SLOPE
        ================================================ */

        if (
            data.slope !== undefined
        ) {

            slopeElement.textContent =
                numberValue(
                    data.slope,
                    1
                )
                +
                "°";

        }


        /* ================================================
           DISTANCE
        ================================================ */

        if (
            data.distance_m !== undefined
        ) {

            distanceElement.textContent =
                numberValue(
                    data.distance_m,
                    1
                );

        }


        /* ================================================
           MOTOR POWER
        ================================================ */

        if (
            data.m_power !== undefined
        ) {

            motorPowerElement.textContent =
                numberValue(
                    data.m_power,
                    0
                );

        }


        /* ================================================
           FUEL CELL POWER
        ================================================ */

        if (
            data.fc &&
            data.fc.power !== undefined
        ) {

            fuelPowerElement.textContent =
                numberValue(
                    data.fc.power,
                    0
                );

        }


        /* ================================================
           TEMPERATURE
        ================================================ */

        if (
            data.ds18b20_temp !== undefined
        ) {

            temperatureElement.textContent =
                numberValue(
                    data.ds18b20_temp,
                    1
                );

        }


        /* ================================================
           SYSTEM STATUS
        ================================================ */

        updateSystemStatus(
            data
        );


        /* ================================================
           GPS
        ================================================ */

        if (
            data.gps &&
            data.gps.lat !== undefined &&
            data.gps.lon !== undefined
        ) {

            updateVehiclePosition(

                Number(
                    data.gps.lat
                ),

                Number(
                    data.gps.lon
                )

            );

        }

    }
);


/* =========================================================
   SYSTEM STATUS
========================================================= */

function updateSystemStatus(
    data
) {

    let warning = false;

    let message =
        "SYSTEM NORMAL";


    /* =====================================================
       FUEL CELL ERROR
    ===================================================== */

    if (
        data.fc &&
        data.fc.error_flag !== undefined &&
        Number(
            data.fc.error_flag
        ) !== 0
    ) {

        warning = true;

        message =
            "FUEL CELL ERROR";

    }


    /* =====================================================
       HYDROGEN LEAK
    ===================================================== */

    if (
        data.fc &&
        data.fc.h2_leak_volts !== undefined
    ) {

        const leak =
            Number(
                data.fc.h2_leak_volts
            );


        if (
            Number.isFinite(
                leak
            ) &&
            leak >= 2.5
        ) {

            warning = true;

            message =
                "HYDROGEN LEAK WARNING";

        }

    }


    /* =====================================================
       HIGH TEMPERATURE
    ===================================================== */

    if (
        data.ds18b20_temp !== undefined
    ) {

        const temperature =
            Number(
                data.ds18b20_temp
            );


        if (
            Number.isFinite(
                temperature
            ) &&
            temperature >= 70
        ) {

            warning = true;

            message =
                "HIGH TEMPERATURE";

        }

    }


    /* =====================================================
       UPDATE
    ===================================================== */

    systemMessage.textContent =
        message;


    if (
        warning
    ) {

        systemPanel.classList.add(
            "warning"
        );

    }

    else {

        systemPanel.classList.remove(
            "warning"
        );

    }

}


/* =========================================================
   MAP DEFAULT LOCATION
========================================================= */

const defaultLat =
    11.0789;


const defaultLon =
    76.9860;


/* =========================================================
   CREATE MAP
========================================================= */

const map =
    L.map(
        "map",
        {

            zoomControl: true,

            scrollWheelZoom: true,

            doubleClickZoom: true,

            dragging: true,

            touchZoom: true,

            keyboard: true

        }
    ).setView(

        [
            defaultLat,
            defaultLon
        ],

        18

    );


/* =========================================================
   OPEN STREET MAP
========================================================= */

L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        maxZoom: 21,

        minZoom: 1,

        attribution:
            "&copy; OpenStreetMap contributors"

    }

).addTo(
    map
);


/* =========================================================
   VEHICLE MARKER
========================================================= */

const marker =
    L.marker(

        [
            defaultLat,
            defaultLon
        ]

    ).addTo(
        map
    );


/* =========================================================
   ROUTE
========================================================= */

let route = [];


const polyline =
    L.polyline(

        route,

        {

            color:
                "#00aaff",

            weight:
                4,

            opacity:
                0.9,

            smoothFactor:
                1.5

        }

    ).addTo(
        map
    );


/* =========================================================
   LAST ROUTE POINT
========================================================= */

let lastRoutePoint =
    null;


/* =========================================================
   GPS FILTER
========================================================= */

const MIN_ROUTE_DISTANCE =
    1.5;


const MAX_ROUTE_DISTANCE =
    15;


/* =========================================================
   HAVERSINE DISTANCE
========================================================= */

function distanceBetweenPoints(

    lat1,
    lon1,
    lat2,
    lon2

) {

    const R =
        6371000;


    const dLat =
        (
            lat2 -
            lat1
        )
        *
        Math.PI /
        180;


    const dLon =
        (
            lon2 -
            lon1
        )
        *
        Math.PI /
        180;


    const a =

        Math.sin(
            dLat / 2
        )
        *
        Math.sin(
            dLat / 2
        )

        +

        Math.cos(
            lat1 *
            Math.PI /
            180
        )

        *

        Math.cos(
            lat2 *
            Math.PI /
            180
        )

        *

        Math.sin(
            dLon / 2
        )
        *

        Math.sin(
            dLon / 2
        );


    const c =
        2 *
        Math.atan2(

            Math.sqrt(a),

            Math.sqrt(
                1 - a
            )

        );


    return R * c;

}


/* =========================================================
   UPDATE VEHICLE POSITION
========================================================= */

function updateVehiclePosition(

    latitude,
    longitude

) {


    /* =====================================================
       VALIDATE GPS
    ===================================================== */

    if (

        !Number.isFinite(
            latitude
        )

        ||

        !Number.isFinite(
            longitude
        )

        ||

        latitude < -90

        ||

        latitude > 90

        ||

        longitude < -180

        ||

        longitude > 180

    ) {

        return;

    }


    const currentPoint = [

        latitude,
        longitude

    ];


    /* =====================================================
       MOVE MARKER
    ===================================================== */

    marker.setLatLng(
        currentPoint
    );


    /* =====================================================
       FIRST POINT
    ===================================================== */

    if (
        lastRoutePoint === null
    ) {

        route.push(
            currentPoint
        );


        lastRoutePoint =
            currentPoint;


        polyline.setLatLngs(
            route
        );


        updateRouteStatus();


        map.setView(

            currentPoint,

            map.getZoom(),

            {
                animate: true
            }

        );


        return;

    }


    /* =====================================================
       MOVEMENT
    ===================================================== */

    const movement =
        distanceBetweenPoints(

            lastRoutePoint[0],

            lastRoutePoint[1],

            latitude,

            longitude

        );


    /* =====================================================
       GPS JITTER
    ===================================================== */

    if (
        movement <
        MIN_ROUTE_DISTANCE
    ) {

        return;

    }


    /* =====================================================
       GPS JUMP
    ===================================================== */

    if (
        movement >
        MAX_ROUTE_DISTANCE
    ) {

        console.warn(

            "GPS jump ignored:",

            movement.toFixed(1),

            "m"

        );

        return;

    }


    /* =====================================================
       ADD ROUTE POINT
    ===================================================== */

    route.push(
        currentPoint
    );


    lastRoutePoint =
        currentPoint;


    /* =====================================================
       LIMIT ROUTE
    ===================================================== */

    const MAX_ROUTE_POINTS =
        2000;


    if (
        route.length >
        MAX_ROUTE_POINTS
    ) {

        route.shift();

    }


    /* =====================================================
       UPDATE POLYLINE
    ===================================================== */

    polyline.setLatLngs(
        route
    );


    updateRouteStatus();


    /* =====================================================
       FOLLOW VEHICLE
    ===================================================== */

    map.panTo(

        currentPoint,

        {

            animate: true,

            duration: 0.4

        }

    );

}


/* =========================================================
   ROUTE STATUS
========================================================= */

function updateRouteStatus() {

    routeStatus.textContent =
        "Route: "
        +
        route.length
        +
        " points";

}


/* =========================================================
   CLEAR ROUTE
========================================================= */

clearRouteButton.addEventListener(

    "click",

    () => {

        route = [];

        lastRoutePoint =
            null;

        polyline.setLatLngs(
            []
        );

        updateRouteStatus();

        console.log(
            "Route cleared"
        );

    }

);


/* =========================================================
   MAP RESIZE
========================================================= */

function resizeMap() {

    setTimeout(

        () => {

            map.invalidateSize(
                true
            );

        },

        150

    );

}


window.addEventListener(
    "resize",
    resizeMap
);


window.addEventListener(
    "orientationchange",
    () => {

        setTimeout(
            resizeMap,
            400
        );

    }
);


if (
    screen.orientation
) {

    screen.orientation.addEventListener(

        "change",

        () => {

            setTimeout(
                resizeMap,
                400
            );

        }

    );

}


setTimeout(
    resizeMap,
    500
);

</script>


</body>
